news_key_issues: '# Paramount Skydance Corp (PSKY) 밸류에이션 영향 핵심 이슈


  ## 규제 승인 (긍정)

  - [주요 성과] 미국 DOJ, $110억 Warner Bros. Discovery 인수 무조건 승인 (6월 12일)

  - [진행 중] EU 외국보조금 검토 진행 중, 7월 14일 결정 예정 (6월 10일)

  - [진행 중] 영국 CMA, $110억 Warner Bros. 인수 공식 검토 개시 (6월 9일)


  ## 규제 리스크 (부정)

  - [리스크] 캘리포니아 등 미국 주(State) 차원의 인수 저지 소송 가능성 (6월 5일)

  - [리스크] 영국 경쟁당국의 공식 조사 진행으로 승인 불확실성 증가 (6월 9일)

  - [리스크] EU 외국보조금 규제 심사로 거래 완료 지연 가능성 (6월 10일)


  ## 거래 구조 변화

  - [진행] Paramount, WBD 발행어음 교환 기한을 7월 1일로 연장 (6월 12일)

  - [자금조달] Warner Bros./Paramount 거래 관련 $150억 규모 레버리지 론 조성 (5월 28일)


  ## 이해관계자 반발

  - [리스크] Netflix의 거래 저지 캠페인 및 규제 당국 로비 활동 (6월 9일)

  - [리스크] 미국 상원의원(Elizabeth Warren) 등 정치권의 거래 저지 요구 (6월 7일)'
