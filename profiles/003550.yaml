peers:
- name: Samsung Electronics (Consumer Electronics Division)
  segment_code: SEG1
  ev_ebitda: 8.5
  notes: Korean listed, comparable home appliance & consumer electronics exposure.
    2023 EBITDA margin ~15-16%, EV/EBITDA derived from market cap and divisional EBITDA
    estimates. Direct competitor in white goods and air solutions.
- name: Coway Co., Ltd.
  segment_code: SEG1
  ev_ebitda: 12.3
  notes: Korean listed (KOSPI), water purifier and air purifier specialist. 2023 EV/EBITDA
    ~12-13x. Premium multiple reflects recurring revenue model and higher margins
    (EBITDA margin ~20%). Partial overlap in air solution segment.
- name: Whirlpool Corporation (USA)
  segment_code: SEG1
  ev_ebitda: 6.8
  notes: Global home appliance leader, direct peer. 2023 EV/EBITDA ~6.5-7.5x. Lower
    multiple reflects mature market, cyclical demand, and margin pressure. USD-denominated;
    use for international benchmark.
- name: Electrolux AB (Sweden)
  segment_code: SEG1
  ev_ebitda: 7.2
  notes: European home appliance manufacturer, comparable scale and product mix. 2023
    EV/EBITDA ~7-7.5x. Reflects European market dynamics and operational efficiency.
    Direct competitor to LG in premium segment.
- name: Midea Group Co., Ltd. (China)
  segment_code: SEG1
  ev_ebitda: 9.1
  notes: Chinese listed, largest home appliance manufacturer by volume. 2023 EV/EBITDA
    ~8.5-9.5x. Higher multiple vs. Western peers reflects growth trajectory and emerging
    market premium. Strong air conditioning and white goods presence.
- name: Arçelik A.Ş. (Turkey)
  segment_code: SEG1
  ev_ebitda: 7.8
  notes: Turkish home appliance manufacturer, emerging market exposure. 2023 EV/EBITDA
    ~7.5-8.5x. Comparable business model to LG in emerging markets. Limited public
    float; multiple estimated from peer trading multiples.
- name: Haier Smart Home Co., Ltd. (China)
  segment_code: SEG1
  ev_ebitda: 10.2
  notes: Chinese listed, diversified home appliance and IoT platform. 2023 EV/EBITDA
    ~9.5-11x. Premium multiple reflects IoT/smart home positioning and higher growth
    expectations vs. traditional appliance makers.
- name: Samsung Electronics (Consumer Electronics Division)
  segment_code: SEG2
  ev_ebitda: 8.5
  notes: Direct competitor in TV/display. 2023 CE EBITDA margin ~7-8%. EV/EBITDA calculated
    from consolidated multiples adjusted for segment contribution. Most comparable
    business structure.
- name: SK Innovation Display (SKID)
  segment_code: SEG2
  ev_ebitda: 9.2
  notes: Korean display panel manufacturer. 2023 EBITDA margin ~8-9%. Listed on KOSDAQ.
    Similar capital intensity and cyclicality to LG Display operations.
- name: Sony Group Corporation
  segment_code: SEG2
  ev_ebitda: 11.5
  notes: Global consumer electronics peer with strong TV/imaging business. 2023 consolidated
