- id: robotaxi_momentum
  name: 로봇택시 상용화 가속화
  category: company
  effects:
    growth_adj_pct: 25
    market_sentiment_pct: 12
  rationale: JPMorgan 상향 조정과 샌안토니오 도입 임박. 자율주행 상용화 성공 사례는 역사적으로 30% 확률이지만, 테슬라의 FSD
    기술 성숙도와 규제 환경 개선으로 성장 가속화 기대
