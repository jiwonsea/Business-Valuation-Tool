    (10-11% EBITDA margin).
- name: TCL Electronics Holdings Limited
  segment_code: SEG2
  ev_ebitda: 7.8
  notes: Major TV manufacturer, Hong Kong listed. 2023 EV/EBITDA ~7.5-8.0%. Lower
