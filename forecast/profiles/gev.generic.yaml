# GE Vernova (GEV) — generic top-down forecast profile.
# Power / Wind / Electrification industrial: revenue is NOT a physical unit x ASP
# feed (no verifiable external bit/wafer/subscriber driver), so it uses the
# generic path (schemas/generic.py), NOT the memory engine. Bottom-up unit x ASP
# is deliberately avoided (PLAN_nvidia_application.md §2 decision rule).
#
# DATA PROVENANCE (EFE-Q2-2026, 2026-07-22): `actuals` are OFFICIAL standalone
# quarters from EDGAR companyfacts as-filed originals (10-Q; Q4 = same-FY 10-K
# annual minus Q3 10-Q 9M — original filings, no disclosure-vintage mixing),
# CIK 1996810, fetched via the WebFetch tool (sandbox httpx is 403-blocked to
# data.sec.gov). The whole-blob build (scripts/build_generic_actuals.py --cik
# 1996810 --fye-month 12 --start 2024Q1 --end 2026Q1) is a HOST follow-up; the
# rows below were assembled by hand replicating that script's logic and verified
# against the same FY-sum + as-filed-EPS identities (see notes). EPS is NOT
# stored: it is DERIVED at load from net_profit and diluted_shares (no splits)
# — see schemas/generic.py. As-filed EPS + accession live in each row's source.
#
# LABEL CONTRACT: December fiscal-year filer -> fiscal FY(N)Qq == model NQq
# (identity, no offset). Consensus alignment uses calendar quarters directly.
#
# ⚠️ STRUCTURAL CAVEAT (per START-efe-q2-2026-gev.md): GE Vernova spun off from
# GE on 2024-04-02. Only ~8 standalone quarters exist (2024Q2..2026Q1); 2024Q1
# is GEV's own as-filed carve-out quarter (pre-legal-separation, same reporting
# entity — NOT pro-forma segment reconstruction). regime_break_quarter=2024Q2
# marks the first post-spin standalone quarter. The 1-step backtest window is
# very short -> naive-RW baseline and seasonal slots are thin -> skill metrics
# (MASE/Theil) are DIRECTION-ONLY, low confidence. Label them "N~8/9, 표본 부족".
name: "GE Vernova Inc."
name_kr: "지이 버노바"
ticker: "GEV"
currency: "USD"
reporting_unit: "USD_million"
fiscal_year_end_month: 12          # calendar-year filer

# FORWARD-ONLY assumption (fixed forward share count). GEV is buying back stock
# (~1.8M shares/$1.3B in 2026Q1) so the count drifts down 279M->272M; 272M is
# the 2026Q1 as-filed diluted count, used as the forward anchor. Historical
# actuals use their own per-quarter as-filed shares instead.
weighted_avg_diluted: 272000000

# Spin 2024-04-02. A pre/post-spin backtest split is NOT set: only one pre-spin
# quarter (2024Q1) exists, too few for a meaningful pre-break window (and the
# shared render crashes on an empty window — NOTICED BUT NOT TOUCHING, host fix).
# Full-window backtest is reported with the short-N direction-only caveat.
regime_break_quarter: null

# No stock splits since listing.
split_history: []

# Historical one-step methodology uses target-quarter calendar slots:
# [Q1, Q2, Q3, Q4]. Kept separate from positional forward assumptions below.
backtest_methodology:
  revenue_growth_qoq: [-0.22, 0.15, 0.10, 0.13]
  op_margin: 0.092
  effective_tax_rate: 0.22
  net_interest_pct_of_revenue: 0.013

seed:
  quarter_label: "2026Q1"
  revenue_total: 9339            # 2026Q1 actual (10-Q 0001996810-26-000064)
  # net_profit/eps intentionally OMITTED: 2026Q1 reported NI ($4,745M) is
  # dominated by a one-time deferred-tax valuation-allowance release (op income
  # was only $179M). Forward EPS must NOT inherit that; project_scenario uses
  # seed.revenue_total only.

# Official standalone quarters, contiguous 2024Q1..2026Q1 (9 rows, Q4 restored
# as annual-9M). Revenue/net_profit in USD_million; diluted_shares absolute.
actuals:
  - { quarter_label: "2024Q1", period_end: 2024-03-31, revenue_total: 7260, net_profit: -130, diluted_shares: 274000000, source: "EDGAR 10-Q 0001996810-25-000073 filed 2025-04-23 (as-filed EPS -0.47, as-filed basis; comparative carve-out quarter, spin 2024-04-02)" }
  - { quarter_label: "2024Q2", period_end: 2024-06-30, revenue_total: 8204, net_profit: 1294, diluted_shares: 278000000, source: "EDGAR 10-Q 0001996810-24-000067 filed 2024-07-24 (as-filed EPS 4.65, as-filed basis; NI>OP $527M via large below-OP gain)" }
  - { quarter_label: "2024Q3", period_end: 2024-09-30, revenue_total: 8913, net_profit: -96, diluted_shares: 275000000, source: "EDGAR 10-Q 0001996810-24-000083 filed 2024-10-23 (as-filed EPS -0.35, as-filed basis)" }
  - { quarter_label: "2024Q4", period_end: 2024-12-31, revenue_total: 10559, net_profit: 484, diluted_shares: 281000000, source: "EDGAR 10-K-10-Q 0001996810-25-000011 - 0001996810-24-000083 filed 2025-02 (as-filed EPS n/a, derived Q4=FY-9M; shares 4xFY-3x9M)" }
  - { quarter_label: "2025Q1", period_end: 2025-03-31, revenue_total: 8032, net_profit: 254, diluted_shares: 279000000, source: "EDGAR 10-Q 0001996810-25-000073 filed 2025-04-23 (as-filed EPS 0.91, as-filed basis)" }
  - { quarter_label: "2025Q2", period_end: 2025-06-30, revenue_total: 9111, net_profit: 514, diluted_shares: 276000000, source: "EDGAR 10-Q 0001996810-25-000133 filed 2025-07-23 (as-filed EPS 1.86, as-filed basis)" }
  - { quarter_label: "2025Q3", period_end: 2025-09-30, revenue_total: 9969, net_profit: 452, diluted_shares: 275000000, source: "EDGAR 10-Q 0001996810-25-000160 filed 2025-10-22 (as-filed EPS 1.64, as-filed basis)" }
  - { quarter_label: "2025Q4", period_end: 2025-12-31, revenue_total: 10956, net_profit: 3664, diluted_shares: 273000000, source: "EDGAR 10-K-10-Q 0001996810-26-000015 - 0001996810-25-000160 filed 2026-02 (as-filed EPS n/a, derived Q4=FY-9M; NI incl large deferred-tax valuation-allowance release)" }
  - { quarter_label: "2026Q1", period_end: 2026-03-31, revenue_total: 9339, net_profit: 4745, diluted_shares: 272000000, source: "EDGAR 10-Q 0001996810-26-000064 filed 2026-04-22 (as-filed EPS 17.44, as-filed basis; NI incl deferred-tax valuation-allowance release, op income only $179M)" }

window:
  start_quarter: "2026Q2"
  n_quarters: 4

# ---------------------------------------------------------------------------
# Forward scenarios (2026Q2..2027Q1). Top-down: revenue_growth_qoq (seasonal) x
# op_margin, + net_interest_pct (GEV structural net interest/other income on its
# ~$8B net cash + equity income), taxed at a NORMALIZED rate.
#
# TAX ANCHOR (critical): 2025Q4/2026Q1 reported NI was inflated by a one-time
# deferred-tax valuation-allowance release (2026Q1 NI $4,745M vs op income
# $179M). Going forward GEV books a NORMAL tax expense (~20-24%), so forward net
# income is FAR below those two prints. effective_tax_rate below is the
# normalized rate, NOT the ~0% realized during the release.
#
# op_margin here is a blended GAAP-operating-margin proxy (segment mix: Power
# 17-19% EBITDA / Electrification 18-20% / Wind ~-$400M EBITDA loss, less D&A
# and corporate) calibrated so base 2026Q2 EPS sits just above Street. Seasonal
# revenue: Q1->Q2 ~+13-15%, Q2->Q3 ~+9%, Q3->Q4 ~+10-18%, Q4->Q1 ~-24%.
# FY2026 guidance (raised at Q1): revenue $44.5-45.5B, adj EBITDA margin 12-14%,
# FCF $6.5-7.5B, backlog $163B, orders +71% organic.
# ---------------------------------------------------------------------------
base:
  probability: 0.50
  rationale: "가스터빈 매진(당해+익년 대부분)·데이터센터 전력 수요·백로그 $163B·수주 +71%로 매출 모멘텀 견조. base 2026Q2 매출 ~$10.7B(컨센 $10.77B와 인라인), FY26 ~$45B(가이던스 중상단). 영업이익률은 세그먼트 믹스 개선(Power 서비스 마진·Electrification 스케일)으로 확대. 정상화 세율 ~22% 가정. base EPS ~$3.24로 컨센 $3.17을 소폭 상회(GEV의 연속 어닝 비트·수주 전환 반영)."
  revenue_growth_qoq: [0.15, 0.10, 0.13, -0.22]
  op_margin: 0.092
  effective_tax_rate: 0.22
  net_interest_pct_of_revenue: 0.013
bear:
  probability: 0.25
  rationale: "Wind 대형 충당금/일회성 손실(블레이드·계약 손실 이력) 또는 대형 프로젝트 손실 적립이 below-OP/OP 레버를 강타. 매출은 계절성 하단(+10%), 영업이익률이 5%대로 눌리고 세율도 상단(24%). 2026Q2 EPS ~$1.87(YoY 거의 플랫), 컨센 대비 대폭 하회. FY26 매출 ~$42B(가이던스 하단 하회)."
  revenue_growth_qoq: [0.10, 0.06, 0.09, -0.25]
  op_margin: 0.055
  effective_tax_rate: 0.24
  net_interest_pct_of_revenue: 0.010
bull:
  probability: 0.25
  rationale: "AI 전력 수요·가격 인상·Electrification(Prolec GE 포함) 초과 전환으로 매출 상단(+19%), 마진 급확대(Power 가격력+서비스), below-OP 순유입(2024Q2형 이익) 재현. 정상화 세율 하단(20%). 2026Q2 EPS ~$4.25로 컨센 대폭 상회. FY26 매출 ~$47B(가이던스 상회) → 추가 가이던스 상향 트리거."
  revenue_growth_qoq: [0.19, 0.12, 0.15, -0.20]
  op_margin: 0.115
  effective_tax_rate: 0.20
  net_interest_pct_of_revenue: 0.015

notes:
  - "actuals는 EDGAR companyfacts as-filed 원본 공시 기준 공식 분기 GAAP (CIK 1996810; 10-Q, Q4는 동일 회계연도 10-K 연간 − Q3 10-Q 9M 차감 복원). WebFetch로 수집(샌드박스 httpx는 data.sec.gov 403). 화이트블롭 재빌드(scripts/build_generic_actuals.py)는 호스트 후속."
  - "과거 EPS는 저장하지 않고 로드 시 파생: net_profit ÷ 분기별 as-filed 희석주식수(분할 없음). as-filed EPS·accession은 source에 보존. 파생 EPS는 as-filed와 전 분기 일치(2024Q2 4.65·2025Q2 1.86·2025Q3 1.64·2025Q1 0.91·2024Q1 -0.47·2024Q3 -0.35; Q4 파생 2024Q4 1.72≈FY−9M 1.73)."
  - "FY 합 항등식 검증: FY2024 매출 34,936≈34,935(+$1M 반올림)·NI −130+1294−96+484=1,552 정확. FY2025 매출 8032+9111+9969+10956=38,068 정확·NI 254+514+452+3664=4,884 정확."
  - "라벨 계약: 12월 결산 → fiscal FYNQq = model NQq (오프셋 없음)."
  - "⚠️ 표본 부족: 독립 상장 후 ~8분기(2024Q2~)뿐. 1-step 백테스트의 나이브 RW·계절 슬롯이 빈약 → skill(MASE/Theil)은 방향 참고용, 낮은 신뢰도. regime_break=2024Q2."
  - "⚠️ 세금 왜곡: 2025Q4·2026Q1 reported NI는 일회성 이연법인세 valuation allowance 환입으로 부풀려짐(2026Q1 NI $4,745M vs 영업이익 $179M). 파생 EPS(2025Q4 13.4·2026Q1 17.4)는 실제이나 반복 불가 → 백테스트 EPS 오차의 주범(구조적, 리스크밴드行). 전방 세율은 정상화(~22%) 가정."
  - "컨센서스(Zacks/Yahoo, as-of 2026-07-15경): 2026Q2 매출 $10.77B(+18.2% YoY)·GAAP 희석 EPS $3.17(+70.4% YoY). 세그먼트: Power $5.54B(+16.5%)·Wind $1.90B(-15.4%)·Electrification $3.45B(+56.8%). analyst 수 미표기."
