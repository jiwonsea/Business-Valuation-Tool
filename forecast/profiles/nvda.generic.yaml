# NVIDIA (NVDA) — generic top-down forecast profile.
# GPU/accelerated-computing company: revenue is NOT DRAM bits x ASP, so it uses
# the generic path (schemas/generic.py), not the memory engine.
#
# DATA PROVENANCE (NVDA-1, 2026-07-11): `actuals` are OFFICIAL standalone
# quarters from EDGAR companyfacts as-filed originals (10-Q; Q4 = 10-K annual
# minus same-FY Q3 10-Q 9M — original filings, no disclosure-vintage mixing).
# Regenerate with: python scripts/build_generic_actuals.py --cik 1045810
# --fye-month 1 --start 2019Q3 --end 2026Q1 (cache: reports/.cache/).
# EPS is NOT stored: it is DERIVED at load from net_profit and split-adjusted
# per-quarter diluted shares (split_history below) — see schemas/generic.py.
# As-filed EPS + accession are preserved in each row's source string.
#
# LABEL CONTRACT (NVDA-1b): NVDA's fiscal year ends late January; model labels
# are calendar-quarter approximations keyed to the period END date:
# fiscal FY(N) Qq -> model (N-1)Qq. The quarter ending late Jan belongs to Q4
# of the PREVIOUS calendar year (e.g. FY2026Q4 ended 2026-01-25 -> "2025Q4").
# ~1-month offset vs true calendar quarters; consensus alignment must use this
# map, never as_of calendar quarters (NVDA-2).
