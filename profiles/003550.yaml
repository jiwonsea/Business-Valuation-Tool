  name: 글로벌 공급망 정상화
  category: industry
  effects:
    growth_adj_pct: 10
    market_sentiment_pct: 5
  rationale: 반도체 부족 해소와 물류비 정상화로 가전업체 마진 개선 예상. 2022-2023년 공급망 이슈 해결 시 가전업체 평균 10%
    성장률 회복과 5% 밸류에이션 상승 경험
