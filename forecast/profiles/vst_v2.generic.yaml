# Vistra Corp. (VST) — generic top-down forecast profile.
# Merchant IPP / integrated retail power. Revenue is NOT a physical unit x ASP
# feed (no verifiable external MWh x price driver at issuer granularity), so it
# uses the generic path (schemas/generic.py), NOT the memory engine. Bottom-up
# MW x price is deliberately avoided (PLAN_nvidia_application.md §2 rule).
#
# ###########################################################################
# ⚠️⚠️  T1 — GAAP OPERATING MARGIN IS NOT AN ANCHORABLE QUANTITY FOR THIS
#            ISSUER.  READ BEFORE USING op_margin.
# ###########################################################################
# START-efe-aug2026-00-COMMON-DELTA.md §R1 fixes op_margin = consolidated GAAP
# operating margin, shape = seasonal vector, level = latest actual/guidance.
# For VST that rule DEGRADES, and this profile is the counter-example that
# proves it. Unrealized mark-to-market ("MTM") on the commodity hedge book flows
# through BOTH operating revenues AND cost of revenues, so quarterly GAAP
# operating margin is a function of forward-curve marks, not of operations:
#
#   as-filed consolidated GAAP OP margin, 13 consecutive quarters (2023Q1..2026Q1)
#   25.6% 18.5% 20.4%  3.3%  2.8% 21.0% 41.2% 14.8% -3.1% 12.1% 20.9% 10.3% 26.6%
#   mean 16.5%  ·  stdev 11.5pp  ·  CV 0.70  ·  range 44.3pp  ·  sign flips once
#
#   the same 13 quarters, Ongoing Operations Adjusted EBITDA (company basis),
#   as % of the same revenue, where disclosed (2024Q1..2026Q1):
#   26.6% 36.8% 23.0% 49.2% 31.5% 31.7% 31.8% 38.0% 26.5%
#   mean 32.8%  ·  stdev 7.4pp  ·  CV 0.23
#
# 2025Q1 GAAP OP was **-$120M on $3,933M revenue** while Ongoing Adjusted EBITDA
# that quarter was **+$1,240M**. No seasonal vector reconciles those two.
#
# VERDICT ADOPTED (see reports/vst_q2_2026_forecast_FROZEN.md §T1): option
# (C)+(A) — the SCORED forecast target is Ongoing Operations Adjusted EBITDA;
# GAAP diluted EPS is published as a BAND with a LOW_CONFIDENCE point. The
# op_margin / net_interest / tax block below is retained so the generic engine
# still runs end-to-end and so the failure is measurable, NOT because the
# resulting GAAP EPS point carries forecast conviction. Treat every op_margin
# number in this file as "the MTM=0 counterfactual margin", not as an anchor.
#
# Proposed declarative expression of this (for Codex, HANDOFF §6):
#   gaap_op_is_noisy: true   +   scored_target: adjusted_ebitda
# is NOT yet a schema key (schemas/generic.py is extra="forbid"), so it lives in
# notes here. Do not add it to the YAML until the schema lands.
#
# DATA PROVENANCE (EFE-Q2-2026-AUG, frozen 2026-08-04 KST): `actuals` are
# OFFICIAL standalone quarters from EDGAR companyfacts as-filed originals
# (10-Q; Q4 = same-FY 10-K annual minus Q3 10-Q 9M — original filings, no
# disclosure-vintage mixing), CIK 1692819, fetched via the WebFetch tool
# (sandbox httpx is 403-blocked to data.sec.gov). The whole-blob build
# (scripts/build_generic_actuals.py --cik 1692819 --fye-month 12
# --start 2023Q1 --end 2026Q1) is a HOST follow-up. EPS is NOT stored: it is
# DERIVED at load from net_profit and diluted_shares. As-filed EPS + accession
# live in each row's source.
#
# net_profit CONTRACT: net income attributable to Vistra **common** stock
# (i.e. AFTER preferred dividends and noncontrolling interests), so that the
# derived eps = net_profit / diluted_shares reproduces as-filed diluted EPS.
# Consequence: net_interest_pct_of_revenue in the forward block absorbs
# interest expense + other income/(expense) + preferred dividends together.
#
# LABEL CONTRACT: December fiscal-year filer -> fiscal FY(N)Qq == model NQq
# (identity, no offset). Consensus alignment uses calendar quarters directly.
name: "Vistra Corp."
name_kr: "비스트라"
ticker: "VST"
currency: "USD"
reporting_unit: "USD_million"
fiscal_year_end_month: 12          # calendar-year filer

# FORWARD-ONLY assumption (fixed forward share count). VST has retired ~30% of
# its shares since Nov-2021 and deployed $525M in 2026Q1 alone with ~$1.475B
# authorization remaining (expected complete by YE2027). 2026Q1 as-filed diluted
# count = 341,856,774; at ~$500M/qtr and ~$165/sh that is ~3M shares/qtr, so the
# 2026Q2 forward anchor is 338,000,000. T5 (buyback lever) is pre-registered as
# a swing factor precisely because this number, not operations, carries a
# material slice of EPS growth.
weighted_avg_diluted: 338000000

# No regime break inside the window. (Energy Harbor closed 2024-03-01 — inside
# 2024Q1 — and Cogentrix has NOT closed as of the freeze, see notes.)
regime_break_quarter: null

# No stock splits.
split_history: []

# Historical one-step methodology uses TARGET-QUARTER CALENDAR SLOTS [Q1,Q2,Q3,Q4]
# (DELTA §R4: mandatory for strongly seasonal issuers even on a December FYE).
# `project_scenario` (forward) is POSITIONAL and lives in base/bear/bull below —
# one vector cannot satisfy both conventions.
#
# ⚠️ These slot values are the honest slot MEANS of a series whose dispersion is
# larger than its mean (see T1 banner). They exist so the backtest can MEASURE
# the failure, not because they predict. Expect large MAPE on EPS.
backtest_methodology:
  # revenue slot medians, 2023Q1..2026Q1: Q1 -0.8% / Q2 +8.1% / Q3 +28.1% / Q4 -24.7%
  revenue_growth_qoq: [0.05, 0.08, 0.25, -0.23]
  # GAAP OP margin slot means: Q1 13.0% / Q2 17.2% / Q3 27.5% / Q4 9.5%
  op_margin: [0.130, 0.172, 0.275, 0.095]
  effective_tax_rate: 0.19
  net_interest_pct_of_revenue: -0.055

