  rationale: "'비트가 소멸하는' 시나리오: FY26Q4 매출 $8,092M(+36.0% QoQ)로 가이던스 레인지 안($7,750~8,250M)에 착지, 4분기 연속 상회 행진이 끝난다. 트리거 — ①컨슈머·클라이언트 SSD·eMMC/UFS의 가격 수용 한계(TrendForce 2026-07-03: 3Q26 NAND +10~15%로 급감속, '컨슈머 고객의 가격 감내가 한계에 도달'), ②SNDK 매출의 14%인 컨슈머가 FQ3에 이미 QoQ −10%, ③FQ3에 ASP를 너무 앞서 올려 4~6월 증분이 작음. 마진도 함께 눌림: GAAP GM 79.5%(가이던스 중간값 수준), opex $570M(SBC·분사비용 초과), 영업이익률 72.5%. 세율 17.0%(지역믹스·밸류에이션 얼라운스 재설정, R3). below-OP −1.0% of revenue(−$81M): 플래시벤처스 지분법 손실·FX·재고평가 — FY26Q2에 실제로 −$128M(매출의 −4.2%)을 찍은 블록이다."
  revenue_growth_qoq: [0.360, 0.020, -0.080, -0.180]
  op_margin: [0.725, 0.690, 0.620, 0.520]
  effective_tax_rate: [0.170, 0.180, 0.180, 0.180]
