    semiconductor valuation. 2024 EV/EBITDA ~17-20x. Source: Historical FactSet data.'
- name: Advanced Micro Devices (AMD)
  segment_code: SEG2
  ev_ebitda: 24.0
  notes: 'Semiconductor infrastructure (CPUs, GPUs, data center). Comparable scale
