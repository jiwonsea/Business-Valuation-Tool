#    딜에 이미 반영된 할인(장부 996.89 → 703.44, 헤어컷 293.45억)에 엔진 할인을 또 얹으면 이중차감.
#    (기본 SOTP 343원 vs Base 시나리오 420원 불일치의 원인 — Codex [필수-1])
distress_max_discount: 0.0

# 원스토어 장부 996.89억 분해:
#   조정순현금 431.34 (현금성 738.44 − 예수금 307.10, 개발사 정산 대기금)
#   Kuaikan World(Cayman) RCPS 523.02 (공정가치 수준 3, 부채요소 할인율 26~28.11%)
#   기타 순영업자산 42.53
# → 딜가 703.44 역산: Kuaikan×회수율 + 앱마켓 영업가치 = 229.57억
#    앱마켓 영업가치 0 가정 시 Kuaikan 회수율 = 43.9%
#    즉 이 딜은 "Kuaikan 약 44% 회수 + 앱마켓 영업가치 ≈ 0"과 정합
# → PBR 시나리오는 Kuaikan 회수율로 설계 (앱마켓 영업가치는 전 시나리오 0 고정)
