  revenue_growth_qoq: [0.275092, -0.025, 0.03, 0.02]
  op_margin: [0.8248, 0.8231, 0.8233, 0.8203]
  effective_tax_rate: 0.1386
  net_interest_pct_of_revenue: -0.00228

