    FactSet.'
- name: Atlassian Corporation
  segment_code: SEG1
  ev_ebitda: 42.0
  notes: 'Enterprise DevOps & collaboration software (Jira, Confluence). High-growth
    SaaS with strong retention. 2024 EV/EBITDA ~40-44x. Source: Bloomberg consensus.'
- name: SK C&C Co., Ltd. (SKC&C)
  segment_code: SEG1
  ev_ebitda: 12.5
  notes: 'Korean enterprise IT services & cloud solutions. Domestic comparable for
