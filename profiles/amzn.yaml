    but subscription growth. 2023 EV/EBITDA ~7-8x.
- name: Naver
  segment_code: SEG5
  ev_ebitda: 12.5
  notes: Korean platform with subscription services (Webtoon, music), content distribution.
    KOSPI listed. Premium multiple reflects growth profile and digital ecosystem.
    2023 EV/EBITDA ~12-13x.
- name: Netflix Inc
  segment_code: SEG5
  ev_ebitda: 18.0
  notes: Global subscription media leader, direct comparable for streaming segment.
    NASDAQ listed. 2023 EV/EBITDA ~17-19x reflecting mature subscriber base and profitability
    inflection.
- name: The Walt Disney Company
  segment_code: SEG5
  ev_ebitda: 14.5
  notes: Diversified media with subscription (Disney+), content, retail operations.
    NYSE listed. 2023 EV/EBITDA ~14-15x reflecting streaming losses offset by traditional
    media strength.
- name: 'Whole Foods Market (Amazon subsidiary proxy: Kroger)'
  segment_code: SEG5
  ev_ebitda: 9.0
  notes: Premium grocery retailer comparable for physical retail segment. NYSE listed.
    2023 EV/EBITDA ~8-10x for specialty/premium grocery operators.
