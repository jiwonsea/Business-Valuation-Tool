window:
  start_quarter: "2026Q2"
  n_quarters: 4

# FORWARD SCENARIOS (2026Q2..2027Q1). Growth is per-quarter QoQ, matched to IBM's
# strong seasonality (Q1->Q2 up, Q2->Q3 down, Q3->Q4 up big, Q4->Q1 down big).
# op_margin here is a REDUCED-FORM GAAP margin, calibrated per-quarter so that
# (op_margin - |net_int|)*(1-tax) reproduces IBM's seasonal GAAP NET margin
# (Q1 ~8%, Q2 ~13%, Q3 ~11%, Q4 ~19%). It is NOT IBM's reported non-GAAP
# operating margin (which is higher). The engine forecasts GAAP net income / EPS;
# the GAAP->operating(non-GAAP) bridge (+~$0.60/qtr, acq. amortization + pension +
# workforce charges, elevated by Confluent/HashiCorp) is applied in the FROZEN
# report, not here. See notes.
base:
  probability: 0.50
  rationale: "Software 두자릿수(레드햇/Data·watsonx) 지속하나 메인프레임(z17) 사이클 감속으로 Infrastructure YoY 둔화, Consulting 저성장. FX는 소폭 순풍. Q2 매출 ~$17.6B(+3.6% YoY, 컨센 $17.85B 소폭 하회)."
  revenue_growth_qoq: [0.105, -0.045, 0.185, -0.180]
  op_margin: [0.159, 0.135, 0.230, 0.100]
  effective_tax_rate: 0.15
  net_interest_pct_of_revenue: -0.006
bear:
  probability: 0.30
  rationale: "z17 사이클 조기 롤오버 + Consulting 재량지출 위축(딜 슬리피지), TP(트랜잭션프로세싱) 침식, AI 백로그 매출전환 지연. 마진 압박. Q2 매출 ~$17.1B(+0.8% YoY)로 컨센 명확 하회."
  revenue_growth_qoq: [0.075, -0.060, 0.160, -0.190]
  op_margin: [0.145, 0.120, 0.210, 0.090]
  effective_tax_rate: 0.16
  net_interest_pct_of_revenue: -0.007
bull:
  probability: 0.20
  rationale: "Software 재가속(watsonx/HashiCorp/Confluent 기여) + z17 견조 유지 + FX 순풍 확대 + 마진 확장. Q2 매출 ~$18.0B(+5.9% YoY)로 가이던스 부합/컨센 상회."
  revenue_growth_qoq: [0.130, -0.035, 0.200, -0.170]
  op_margin: [0.170, 0.145, 0.245, 0.110]
  effective_tax_rate: 0.145
  net_interest_pct_of_revenue: -0.005

notes:
  - "actuals=EDGAR companyfacts as-filed 원본 공식 분기 GAAP (CIK 0000051143; 10-Q 3M; Q4=10-K FY − 9M, 동일 회계연도 원본). FY 합계 항등식(매출·순이익) FY2023/24/25 정확 일치 검증. EFE Q2-2026 배치 2026-07-22."
  - "과거 EPS 미저장·로드 시 파생: net_profit ÷ 분기별 희석주식수(무분할). as-filed EPS·accession은 source에 보존."
  - "라벨 계약: 12월 결산 → fiscal FY(N)Qq = model NQq (오프셋 없음). 컨센서스 조인에 회계연도 시프트 불필요."
  - "op_margin은 GAAP 순이익 계절성을 재현하는 축약형(reduced-form) 마진이며, IBM 보고 비GAAP operating margin이 아님. 엔진은 GAAP 순이익/EPS를 산출; GAAP→operating(비GAAP) 브릿지(+~$0.60/분기: 취득무형 상각·연금·workforce; Confluent/HashiCorp로 확대)는 FROZEN 리포트에서 적용."
  - "2024Q3 순손실(-330M)은 ~$2.7B 연금 정산 charge에 기인한 below-OP 일회성 — generic이 예측 못하는 구조적 항목의 대표 사례(리스크밴드 대상)."
  - "샌드박스 data.sec.gov 403 → WebFetch로 companyconcept 슬라이스 수집, FY 항등식 수기 교차검증. 호스트에서 build_generic_actuals.py --cik 51143 --fye-month 12 로 정규 캐시+자동검증 재생성 권장."
