# IBM (International Business Machines) — generic top-down forecast profile.
# Software + Consulting + Infrastructure + Financing conglomerate: revenue is NOT
# DRAM bits x ASP, so it uses the generic path (schemas/generic.py), not the
# memory engine. No independent physical-driver feed exists (segment revenue is a
# top-down mix), so per COMMON §1 this is a matrix top-down model, not bottom-up.
#
# DATA PROVENANCE (EFE Q2-2026 batch, 2026-07-22): `actuals` are OFFICIAL
# standalone quarters from EDGAR companyfacts as-filed originals (CIK 0000051143;
# us-gaap:Revenues / NetIncomeLoss / WeightedAverageNumberOfDilutedSharesOutstanding).
# Q1-Q3 = direct 3-month facts (earliest accession per period). Q4 = FY(10-K)
# minus 9M — original filings of the same fiscal year, no disclosure-vintage
# mixing. Q4 diluted shares derived as 4*FY_avg - 3*9M_avg (plausibility-guarded).
# FY sum identity (rev & NI) verified EXACT for FY2023/2024/2025; as-filed EPS
# coherence (NI/shares vs reported diluted EPS) green for every quarter.
# EPS is NOT stored: DERIVED at load from net_profit / diluted_shares (no splits;
# split_history empty). As-filed diluted EPS + accession preserved in `source`.
#
# SANDBOX NOTE: the whole-blob edgar_fetcher could not run in the Cowork sandbox
# (data.sec.gov 403 to processes; browser not connected). Facts were pulled via
# the WebFetch tool from data.sec.gov companyconcept slices and cross-checked
# with the FY-sum identity by hand. HOST TODO: regenerate the canonical block +
# auto-verification with:
#   python scripts/build_generic_actuals.py --cik 51143 --fye-month 12 --start 2023Q1 --end 2026Q1
#
# LABEL CONTRACT: IBM fiscal year ends December (calendar filer) -> fiscal FY(N)Qq
# == model NQq (identity, no offset). Consensus join needs no fiscal shift.
name: "International Business Machines"
name_kr: "IBM"
ticker: "IBM"
currency: "USD"
reporting_unit: "USD_million"
fiscal_year_end_month: 12          # calendar filer, no consensus offset

# FORWARD-ONLY assumption (kept fixed). Q1 2026 as-filed diluted was 952.1M;
# share count drifts up ~0.3%/qtr (acquisition stock + comp net of buyback).
weighted_avg_diluted: 955000000

# IBM has not split since 1999 -> no adjustment needed; kept explicit/empty.
split_history: []

# No dramatic regime break over 2023-2026 (steady high-single-digit growth), so
# a single backtest window is reported (unlike NVDA's AI-supercycle break).

seed:
  quarter_label: "2026Q1"
  revenue_total: 15917
  net_profit: 1216
  eps_diluted: 1.28

# Official standalone quarters, contiguous 2023Q1..2026Q1 (13 rows, Q4 restored).
# revenue_total & net_profit in USD millions; diluted_shares absolute; GAAP.
