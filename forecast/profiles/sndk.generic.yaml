# Sandisk Corporation (SNDK) — generic top-down forecast profile.
# NAND flash pure-play. Revenue IS conceptually bits x ASP, but SanDisk does NOT
# publish a verifiable per-quarter bit/ASP feed (only qualitative call remarks),
# and no independent external feed reconciles to its P&L. Per
# PLAN_nvidia_application.md §2 the bottom-up unit x ASP path is therefore
# refused: this profile uses the generic top-down path (schemas/generic.py).
# The SK Hynix memory engine (cli.py / engine/segment_revenue.py /
# margin_model.py) is NOT touched.
#
# ---------------------------------------------------------------------------
# LABEL CONTRACT (critical — non-December fiscal-year filer)
# ---------------------------------------------------------------------------
# SanDisk's fiscal year ends on the Friday nearest 30 June (52/53-week);
# EDGAR submissions.json fiscalYearEnd = 0628. Model quarter label "NQq" means
# FISCAL FY(N) Q(q) — NOT a calendar quarter. Mapping for the rows below:
#
#   model 2026Q3 = FY2026 Q3 = 2026-01-03 .. 2026-04-03  (~calendar 2026 Q1)
#   model 2026Q4 = FY2026 Q4 = 2026-04-04 .. 2026-07-03  (~calendar 2026 Q2)  <- TARGET
#   model 2027Q1 = FY2027 Q1 = 2026-07-04 .. ~2026-10-02 (~calendar 2026 Q3)
#
# The forecast target is FISCAL Q4 FY2026, which is CALENDAR Q2 2026. Every
# consensus join, report label and test in this repo must use the fiscal label.
# See tests/test_sndk_profile.py::test_fiscal_label_maps_to_calendar_quarter.
#
# Because the label digit IS the fiscal quarter, generic_cli.backtest_generic's
# `_slot(label) = int(label[-1]) - 1` selects the FISCAL-quarter slot, and
# backtest_methodology.revenue_growth_qoq below is ordered [FQ1, FQ2, FQ3, FQ4].
# The forward vectors in bear/base/bull are POSITIONAL from the seed and are
# therefore ordered [FQ4, FQ1, FQ2, FQ3] — deliberately a different ordering.
# (START-efe-aug2026-00-COMMON-DELTA.md §R4.)
#
# ---------------------------------------------------------------------------
# DATA PROVENANCE (EFE-2026aug-SNDK, frozen 2026-08-04/05 KST)
# ---------------------------------------------------------------------------
# `actuals` are official quarterly GAAP from EDGAR XBRL companyconcept slices
# for CIK 0002023554 (Revenues / NetIncomeLoss / OperatingIncomeLoss /
# WeightedAverageNumberOfDilutedSharesOutstanding), fetched with the WebFetch
# tool (sandbox httpx is 403-blocked to data.sec.gov). Whole-blob companyfacts
# capture + byte SHA-256 is a HOST follow-up (00-COMMON.md §7 sandbox clause).
# Q4 rows are restored as FY(10-K) − 9M(Q3 10-Q); FY2024 Q1 as H1 − Q2 inside
# the same accession. All four FY sum identities tie EXACTLY (see notes).
# EPS is NOT stored: it is DERIVED at load from net_profit and the as-filed
# per-quarter diluted share count (no splits) — schemas/generic.py.
#
# ⚠️ STRUCTURAL CAVEAT: SanDisk was spun off from Western Digital on 2025-02-21,
# mid-FY2025-Q3. Rows before 2025Q3 are SanDisk's own as-filed carve-out /
# combined comparatives (its own accessions, not third-party reconstruction),
# analogous to GEV 2024Q1. regime_break_quarter = 2025Q3 = first quarter as a
# standalone SEC registrant. Only 5 fully standalone quarters exist
# (2025Q3..2026Q3) -> skill metrics are LOW-CONFIDENCE. See notes.
name: "Sandisk Corporation"
name_kr: "샌디스크"
ticker: "SNDK"
currency: "USD"
reporting_unit: "USD_million"
fiscal_year_end_month: 6
weighted_avg_diluted: 158000000    # company FQ4 FY26 guidance "~158" diluted

# Spin-off 2025-02-21 (completed mid-FY25Q3). 2025Q3 is the first quarter filed
# as a standalone registrant.
regime_break_quarter: "2025Q3"

# No stock splits since listing (2025-02-24 when-issued / regular-way).
split_history: []

# ---------------------------------------------------------------------------
# Historical one-step backtest methodology — FISCAL-quarter slots [FQ1..FQ4].
# Deliberately ex-ante-blind and mechanical: median of the realised history in
# the actuals block, NOT the forward view. This is what an analyst with only
# SanDisk's own filings and no cycle judgement would have used.
#   revenue_growth_qoq: per-slot MEDIAN QoQ growth over the 10 one-step
#     transitions (FQ1 mean of 2 obs 0.0699/0.2141; FQ2 median of
#     0.0861/-0.0037/0.3107; FQ3 median of 0.0240/-0.0965/0.9669;
#     FQ4 mean of 2 obs 0.0323/0.1215).
#   op_margin 0.090 = median GAAP operating margin of the 10 target quarters
#     (range -111.0% .. +69.1%).
#   effective_tax_rate 0.14 = median GAAP ETR of the profitable quarters
#     (FY26Q3 12.0% / FY26Q2 14.3% / FY26Q1 9.7% / FY25Q1 21.0%).
#   net_interest_pct_of_revenue -0.019 = median (total interest & other, net) /
#     revenue (FY26Q3 -0.07% / FY26Q2 -4.23% / FY26Q1 -2.25% / FY25Q4 -1.89% /
#     FY25Q1 -1.27%).
# ⚠️ EXPECTED TO PERFORM BADLY, AND THAT IS THE POINT: a single median margin
# cannot track a cycle that moved GAAP op margin from +0.9% to +69.1% in four
# quarters. Report MASE/Theil honestly even if > 1 (DELTA §2.1).
# ---------------------------------------------------------------------------
backtest_methodology:
  revenue_growth_qoq: [0.142, 0.0861, 0.024, 0.0769]
  op_margin: 0.090
  effective_tax_rate: 0.14
  net_interest_pct_of_revenue: -0.019

