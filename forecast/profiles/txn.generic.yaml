#
# DATA PROVENANCE (TXN-1, 2026-07-22): `actuals` are OFFICIAL standalone quarters
# from EDGAR companyfacts as-filed originals (10-Q; Q4 = 10-K annual minus same-FY
# 9M 10-Q — original filings, no disclosure-vintage mixing). Because the Cowork
# sandbox proxy 403s data.sec.gov for processes, the companyfacts blob was rebuilt
# as a DERIVED cache from web_fetch companyconcept transcriptions (as-filed original
# accessions only) at reports/.cache/edgar_companyfacts_CIK0000097476.json, then
# assembled + verified by scripts/build_generic_actuals.py (FY-sum identity for
# revenue & NI + as-filed EPS coherence + contiguity — all green, 21 quarters).
# Regenerate on host with: python scripts/build_generic_actuals.py --cik 97476
# --fye-month 12 --start 2021Q1 --end 2026Q1 (host: delete derived cache first and
# refetch the full blob via fetch_companyfacts(97476), SEC_EDGAR_USER_AGENT set).
# EPS is NOT stored: it is DERIVED at load from net_profit / diluted_shares — see
# schemas/generic.py. As-filed EPS + accession are preserved in each row's source.
#
# LABEL CONTRACT: TXN fiscal year ends December (calendar filer) → fiscal FY(N) Qq
# == model NQq (identity, no offset). No ~1-month consensus-join offset (unlike
# NVDA Jan / MSFT Jun / AAPL Sep). No stock splits in the covered window
# (split_history empty).
