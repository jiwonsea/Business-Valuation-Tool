  - { quarter_label: "2024Q1", period_end: 2024-03-31, revenue_total: 14462, net_profit: 1605, diluted_shares: 933431312, source: "EDGAR 10-Q 0000051143-24-000025 filed 2024-04-30 (as-filed EPS 1.72)" }
