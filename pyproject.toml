[project]
name = "business-valuation-tool"
version = "0.1.0"
description = "AI-assisted Korean corporate valuation platform — SOTP, DCF, scenario analysis"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0,<3",
    "pyyaml>=6.0,<7",
    "pandas>=2.0,<3",
    "numpy>=1.24,<3",
    "openpyxl>=3.1,<4",
    "python-dotenv>=1.0,<2",
]

[project.optional-dependencies]
ai = ["anthropic>=0.30,<1", "openai>=1.0,<2"]
pipeline = ["httpx>=0.27,<1", "beautifulsoup4>=4.12,<5", "yfinance>=0.2.30,<1", "defusedxml>=0.7,<1", "portalocker>=2.0,<4"]
ui = ["streamlit>=1.37,<2", "plotly>=5.18,<6"]
db = ["supabase>=2.0,<3"]
publish = [
    "edge-tts>=7.0,<8",
    "moviepy>=2.0,<3",
    "markdown>=3.5,<4",
    "google-api-python-client>=2.100,<3",
    "google-auth-oauthlib>=1.2,<2",
    "selenium>=4.20,<5",
]
sentiment = ["transformers>=4.40,<5", "torch>=2.0,<3"]
dev = ["pytest>=9.0.3,<10", "ruff>=0.4,<1"]
# Keep shared requirements synchronized with the pipeline and db extras above.
test = [
    "pytest>=9.0.3,<10",
    "httpx>=0.27,<1",
    "beautifulsoup4>=4.12,<5",
    "yfinance>=0.2.30,<1",
    "defusedxml>=0.7,<1",
    "portalocker>=2.0,<4",
    "supabase>=2.0,<3",
    "selenium>=4.20,<5",
    "markdown>=3.5,<4",
]
forecast = [
    "pydantic>=2.6,<3",
    "yfinance>=0.2.40,<1",
    "httpx>=0.27,<1",
    "pandas>=2.2,<3",
    "numpy>=1.26,<3",
    "scipy>=1.11,<2",
    "plotly>=5.20,<6",
    "matplotlib>=3.8,<4",
    "openpyxl>=3.1,<4",
    "jinja2>=3.1,<4",
    "pyyaml>=6.0,<7",
    "python-dotenv>=1.0,<2",
    "anthropic>=0.40,<1",
    "pymupdf>=1.24,<2",
    "pytest>=8.0,<10",
]

[tool.setuptools]
py-modules = ["_ssl_fix", "cli", "orchestrator", "valuation_runner"]

[tool.setuptools.packages.find]
include = [
    "engine*", "schemas*", "pipeline*", "ai*", "db*", "output*",
    "discovery*", "scheduler*", "forecast*", "backtest*", "calibration*",
]
exclude = ["forecast.tests*", "calibration.tests*"]

[project.scripts]
valuation = "cli:main"
earnings-forecast = "forecast.cli:main"

[tool.ruff]
exclude = [".claude", "forecast"]

[tool.ruff.lint]
# E402: conditional imports after sys.stderr/logging setup are intentional (cli.py, valuation_runner.py)
# E702: semicolon-separated statements in Excel output sheets are intentional compact style
ignore = ["E402", "E702"]

[tool.ruff.lint.per-file-ignores]
# E731: lambda-as-def is acceptable in notebook analysis cells
"bond-yield-analysis/*.ipynb" = ["E731"]

[tool.pytest.ini_options]
testpaths = ["tests", "forecast/tests", "calibration/tests"]
python_files = ["test_*.py"]
addopts = "-ra --strict-markers -m 'not network'"
markers = [
    "network: hits a live external service (DART/EDGAR/Yahoo); excluded by default, run with -m network",
]
