# MU FY2026 Q4 리포트 ed1 — 본문 서술 초안 (Claude, 2026-10-04) · draft r4 (2026-10-05: 5절 사업 구조·부록 방법론 추가, 촉매 표 내부 용어 제거) · r3: 회사 개요·판정 기준·GM 상회 폭·차트 연결·출처 표기
# 대상 절: 2 thesis · 8 scenarios · 10 risks · 11 catalysts (HANDOFF R6-4)
# 규칙:
#  - 숫자는 직접 쓰지 않고 {{fact:...}} 토큰으로 넣는다. 토큰 목록과 바인딩 대상은 맨 아래 `fact_bindings`.
#    (`proposed: true`는 아직 manifest에 없는 fact_id — Codex가 생성·바인딩)
#  - 날짜·계획 일정 같은 회사 진술은 원문 쪽수를 `src`에 둔다. 인용은 15단어 미만.
#  - 조사 표본(sellside_survey) 수치·의견 미사용. 투자의견·목표주가 없음. 확률·가중 없음.
#  - KO/EN은 같은 사실·같은 토큰을 같은 순서로 쓴다(G-15).
# 출처 약어: PR = logs/mu/fy2026q4/postprint/ex991.htm · REM = .../remarks.pdf · SCORED = forecast/reports/mu_fy2026q4_SCORED.md
#            RLE = forecast/inputs/mu_fy2026q4_report_assumptions.yaml · HO = HANDOFF R9·R12·R13

