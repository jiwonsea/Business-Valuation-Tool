bull:
  probability: 0.25
  rationale: "키옥시아 패리티 시나리오: FY26Q4 매출 $9,996M(+68.0% QoQ) — 키옥시아 +76.2%에 컨슈머 믹스 드래그만 차감. 누적 ASP·비트 레벨 정합 계산(키옥시아 1~3월 ASP ×2.05 → 4~6월 ×1.70 = 3.49배 / SNDK 1~3월 ×2.40 → 잔여 1.45배, 비트는 키옥시아 0.90×1.02=0.918 vs SNDK 0.82×1.12)이 대략 +62%를 시사하고, 여기에 데이터센터 eSSD 부족(TrendForce: 2027년 말~2028년까지 유의미한 증설 어려움)과 NBM 5건($42B 최소 계약매출·$11B+ 금융보증·$400M 선수금)의 물량 확정 효과를 더한다. GAAP GM 85.2%(COGS는 비트로만 증가), opex $545M(가이던스 하단), 영업이익률 79.8% — 키옥시아 비GAAP 영업이익률 75.0%·마이크론 FQ4 가이던스 GM 86%와 정합. 세율 11.5%(FDII·지역믹스 우호, FY26Q3 실적 12.0%). below-OP +0.6%(제로부채·현금 $3.7B+ 선수금에서 나오는 이자수익; 가이던스 +$12~32M 상단 초과)."
  revenue_growth_qoq: [0.680, 0.300, 0.160, 0.100]
  op_margin: [0.798, 0.815, 0.820, 0.815]
  effective_tax_rate: [0.115, 0.130, 0.130, 0.130]
