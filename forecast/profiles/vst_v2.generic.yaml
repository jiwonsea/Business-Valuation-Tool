# ---------------------------------------------------------------------------
# Forward scenarios (2026Q2..2027Q1). POSITIONAL vector from the 2026Q1 seed.
#
# ⚠️ growth[0] IS NOT A SEASONAL NUMBER. The 2026Q1 seed revenue of $5,640M
# contains a +$723M unrealized MTM gain. Per DELTA §R2 the forward MTM base is
# ZERO, so growth[0] carries BOTH the de-MTM of the seed AND the underlying
# physical growth:
#     ex-MTM 2026Q1 = 5640 - 723 = 4,917   (+10.0% YoY vs ex-MTM 2025Q1 4,468)
#     ex-MTM 2025Q2 = 4250 + 16  = 4,266
#     base 2026Q2 target = 4,266 x 1.125 = 4,800  (retail + PJM capacity step-up
#                                                  + higher realized power prices)
#     growth[0] = 4800/5640 - 1 = -0.1489
# Anyone reading -14.9% as "Q2 is seasonally down 15%" has misread the model.
#
# ANCHORS (level, per R1's true content = "no historical averages; level = the
# latest actual or company guidance"):
#   - FY2026 Ongoing Adjusted EBITDA guidance $6,800-7,600M, REAFFIRMED at Q1
#     2026 (2026-05-07) and EXCLUDING both Cogentrix (closing H2 2026) and the
#     Meta PPAs.
#   - 2026Q1 actual Ongoing Adjusted EBITDA $1,494M = 20.8% of the $7,200M
#     midpoint; the 2025 quarterly shape was Q1 21.0% / Q2 22.8% / Q3 26.7% /
#     Q4 29.5%.
#   - base 2026Q2 Ongoing Adjusted EBITDA = $1,680M (+24.5% YoY, 23.3% of the
#     $7.2B midpoint) -> OP(MTM=0) = 1680 - D&A 620 - asset closure 20 = $1,040M
#     -> op_margin = 1040/4800 = 21.7%.
#   - 98% of expected 2026 generation is hedged: this CAPS weather/price upside
#     inside 2026 and is the core reason the base sits below the consensus-
#     implied level (see FROZEN §d).
#
# TAX (DELTA §R3 — no single anchor): realized ETR was 18.9% (2025Q2) and 15.1%
# (2026Q1), depressed by nuclear PTC/ITC. bear/base/bull carry 26%/19%/15%.
#
# net_interest_pct_of_revenue absorbs interest expense (~$270-310M/qtr) + other
# income/(expense) + preferred dividends (~$49M/qtr) — see net_profit CONTRACT.
# ---------------------------------------------------------------------------
base:
  probability: 0.50
  rationale: "가이던스 앵커: FY26 Ongoing adj EBITDA $6.8-7.6B(Q1에 재확인, Cogentrix·Meta PPA 제외). 2026Q1 실적 $1,494M = 중간값의 20.8%로 2025년 계절 형태(Q1 21.0%)와 일치 → FY 트래킹 ~$7.1-7.2B. 2025년 Q2 비중 22.8%를 적용해 base 2026Q2 Ongoing adj EBITDA $1,680M(+24.5% YoY). 매출은 MTM=0 가정하 물리 매출 $4,800M(ex-MTM 기준 +12.5% YoY: 리테일 + PJM 용량가격 스텝업 + 실현 전력가격). op_margin 21.7%는 'MTM=0 반사실 마진'이지 앵커가 아님(T1). 세율 19%(2025Q2 18.9%·2026Q1 15.1%의 중간). 2026년 발전량 98% 헤지 → 여름 날씨/가격 상방이 당해 P&L로 거의 전달되지 않음이 base가 컨센 함의치를 밑도는 핵심 근거."
  revenue_growth_qoq: [-0.1489, 0.0800, -0.0700, 0.0500]
  op_margin: [0.217, 0.240, 0.150, 0.230]
  effective_tax_rate: 0.19
  net_interest_pct_of_revenue: -0.065
bear:
  probability: 0.25
  rationale: "선도 커브 상승으로 헤지북에 대규모 미실현 평가손(2025년 FY -$808M, 2024Q3 단일분기 -$1,853M 전례)이 발생해 GAAP 매출·영업이익을 동시에 잠식. 여름 날씨가 정상 이하이고 ERCOT 스파이크 부재 → Ongoing adj EBITDA $1,480M(+9.7% YoY, 가이던스 하단 트래킹). 세율은 크레딧 기여 축소로 26% 상단. 리테일 이탈률 상승·조달원가 상승도 동반 가정."
  revenue_growth_qoq: [-0.2500, 0.0600, -0.0800, 0.0400]
  op_margin: [0.120, 0.190, 0.110, 0.190]
  effective_tax_rate: 0.26
  net_interest_pct_of_revenue: -0.075
bull:
  probability: 0.25
  rationale: "컨센서스 함의 시나리오. 폭염·ERCOT/PJM 스파이크 + 미헤지 2% 물량의 고가 실현 + 리테일 마진 확대로 Ongoing adj EBITDA $1,950M(+44.6% YoY, FY 중간값의 27.1% — 2024·2025 어느 해에도 없던 Q2 비중). 동시에 커브 하락으로 미실현 MTM 평가익이 매출·OP에 유입. 세율 15%(원전 PTC/ITC 최대 기여). 이 경우 회사는 FY26 가이던스를 상향하거나 상단으로 좁힐 것 — 즉 bull이 맞으면 (c)의 '유지' 예측도 함께 틀린다."
  revenue_growth_qoq: [-0.0200, 0.1000, -0.0600, 0.0600]
  op_margin: [0.310, 0.280, 0.190, 0.260]
  effective_tax_rate: 0.15
  net_interest_pct_of_revenue: -0.058

