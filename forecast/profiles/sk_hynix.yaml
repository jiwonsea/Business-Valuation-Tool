# Below-OP (below-the-line) EPS risk band — a SEPARATE layer over the EPS point
# estimate; the structurally volatile below-OP block (net financial / FX / one-offs)
# is NOT folded into the point estimate (would inject lookahead + overfit an 8Q,
# outlier-heavy sample). Seeded by engine.risk_band.robust_half_width over the
# realized 8Q block contribution (block_term/NI from scripts/diagnose_tax_finance.py;
# tests/fixtures/sk_hynix_block_contrib.json).
# CONFIRMED 2026-07-03 (user-delegated sign-off): method=mad, k=1.5 채택.
# 근거 — 2025Q3 +3,407bn 등 이상치가 있는 8Q 표본에서 MAD는 폭이 이상치에 끌려가지
# 않고(트림 대비 보수적), k=1.5는 ~87% 경험 커버(7/8 분기)로 리스크 밴드 목적에 부합.
#   method=mad  -> half_width_pct = 1.4826 × MAD(block_contrib_8Q) × k  (outlier-resistant)
#   k=1.5       -> ~87% empirical coverage (7/8 분기가 ±밴드 내)
#   reference  : MAD k=1.0 = 15.19% (4/8 cover) · trimmed-std 대안 = 11.28%
risk_band:
  method: "mad"
  k: 1.5
  half_width_pct: 0.2279

# Identified below-OP events — output-only event-adjusted EPS scenarios. The EPS
# point estimate, risk_band, backtest, and valuation bridge remain unchanged.
# probability is an analyst judgment, not a statistically estimated frequency.
# The event layer and 8Q MAD band are only approximately separated: the band
# sample contains outliers, MAD limits but does not remove their contribution,
# residual overlap is non-zero, and it is not quantified.
below_op_events:
  - id: "kioxia_spc1_disposal"
    as_of_date: "2026-06-24"
    amount_as_of: "2026-07-28"
    target_period_label: "2026Q2"
    kind: "asset_disposal_gain"
    amount_krw_bn: 40000
    basis: "net_income_level"
    probability: 0.8
    confidence: "estimated"
    source: "KRX disclosure 2026-06-24 (event); Meritz Securities estimate 2026-07-28 (amount)"
    note: "The source calls it non-operating profit, implying pre-tax, but tax treatment is unconfirmed. The event explains about 91% of the KRW 44,097.7bn actual NI gap; the residual is about KRW 4,098bn from other below-OP items and the OP miss."
    revision_trigger: "2026 half-year report — revisit basis and amount when tax treatment is confirmed"

