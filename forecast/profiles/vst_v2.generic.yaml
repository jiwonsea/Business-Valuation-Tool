  - "⚠️⚠️ T1: GAAP OP 마진 13분기 mean 16.5% / stdev 11.5pp / CV 0.70 / 부호반전 1회(2025Q1 -3.1%). 같은 기간 Ongoing adj EBITDA 마진은 CV 0.23. 미실현 파생 MTM이 '매출'과 '매출원가' 양쪽에 비현금으로 유입되므로 op_margin은 헤지북 마킹의 함수다. 이 프로파일의 채점 대상은 Ongoing Operations Adjusted EBITDA이며, GAAP EPS 포인트는 LOW_CONFIDENCE 라벨을 단다."
