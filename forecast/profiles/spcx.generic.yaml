# ############################# REV-1 (프린트-전 정정) #############################
# 2026-08-05 01:45 KST 정정. 최초 동결 2026-08-05 00:46 KST. **여전히 프린트 전**
# (정정 시점 미국 12:45 ET, 장중. 실적은 마감 후) → 소급 은폐가 아니라 사전 정정이다.
