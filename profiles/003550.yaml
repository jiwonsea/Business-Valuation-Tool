  rationale: 현재 Fed Funds 3.63%는 장기 평균 대비 높은 수준. 금리 상승 시 가전업체 WACC 평균 40bp 상승, 소비재
    수요 둔화로 성장률 8% 하락하는 패턴이 과거 3회 금리 인상 사이클에서 관찰됨
