# ---------------------------------------------------------------------------
# Forward scenarios — POSITIONAL [FY26Q4, FY27Q1, FY27Q2, FY27Q3]. GAAP basis.
#
# GUIDANCE (8-K EX-99.1 0000723125-26-000013, FQ4-26; column heads recorded —
# PLAN §4-1b forbids judging basis from the row label):
#   GAAP Outlook:     revenue $50.0B ± $1.0B · GM ~86% · opex ~$1.86B · diluted EPS $30.73 ± $1.00
#   Non-GAAP Outlook: revenue $50.0B ± $1.0B · GM ~86% · opex ~$1.65B · diluted EPS $31.00 ± $1.00
#   Prepared remarks: share count ~1.15B · FQ4 & FY26 tax rate ~15.0% (BASIS NOT STATED) · "meaningful
#   moderation in the rate of price increases" · FY27 opex +~$1B, 2H-weighted.
#
# 🔴 WEEK BASIS (PLAN G0-B): the FQ4 guidance is a 14-WEEK figure (the 53rd week
# is inside it; the remarks never mention weeks). The FQ4 level is therefore
# anchored on guidance and NOT multiplied by 14/13 again. FY27 Q1 returns to 13
# weeks: per-week growth g_week is converted with g_raw = (1+g_week)*13/14 − 1.
# Machine-readable anchors are in notes (WEEK_NORM / ANCHOR) and tested.
#
# LEVEL (R1): latest actual + guidance, never a historical average.
#   FQ4 revenue = guidance mid × (1 + beat):
#     base beat = median of the 10 post-break guidance beats (+0.0572)
#     bull beat = median of the last 4 beats (+0.1645)
#     bear      = guidance LOW end (-0.0200); no miss exists in the record
#   Beat record 2024Q2..2026Q3: 10/10 revenue at/above mid, 10/10 GAAP EPS above mid.
# MARGIN: op_margin = GM − opex/revenue (GAAP GM, GAAP opex $). GM is not a
#   schema field (extra='forbid'); it lives here and in notes (PLAN §3 SF3/SF2).
# TAX: 🔴 base ETR 0.1386 is a BACK-SOLVED RESIDUAL, not a disclosed GAAP rate. It is
#   the rate at which guidance-mid revenue, base GM/opex and the backtest below-OP
#   ratio reproduce the GAAP EPS guide mid ($30.73); it also absorbs the
#   "approximately" rounding in GM, opex and the ~1.15B share count. The EPS-30.73
#   test is therefore an ALGEBRAIC RECONCILIATION, not independent validation.
#   The remarks' "tax rate of around 15.0%" does not state GAAP or non-GAAP; it reads
#   as non-GAAP context, but that is an inference, not a confirmed basis.
#   Sensitivity: at 15% the guidance-mid GAAP EPS is 30.32 (−0.41 / −1.32%).
#   bull = base − 0.5pt; bear = 0.15 (stated rate, basis unstated). See notes TAX_BASIS.
# BELOW-OP (SF5): median ratio -0.00228; equity-method income (≤ $9M/qtr) is outside
#   the engine's pretax×(1−t) chain and is ignored — immaterial, recorded in notes.
# SHAPE (FY27): low confidence. Company signals slower price increases; FY27Q1
#   is also the −7.1% 14w->13w calendar step. Positions 2-4 are NOT the frozen target.
# ---------------------------------------------------------------------------
bear:
  probability: 0.2
  rationale: "Guidance low end in FQ4; price rollover in FY27 (per-week −8%/−10%/−5%), GM 85%->75%, stated 15% tax."
  revenue_growth_qoq: [0.181976, -0.145714, -0.1, -0.05]
  op_margin: [0.812, 0.7846, 0.7382, 0.6899]
  effective_tax_rate: 0.15
