#   C1. `net_profit: -4270`은 **세전손실**이었다. 원문 연결 순손실은 **-4,276**.
#       (보통주 귀속 순손실은 **-4,947** — 우선주 간주배당 565 + 기타 106 포함.)
#   C2. `net_interest_pct_of_revenue`가 **이자수익을 차감하지 않은 총액 기준**이었다.
#       원문 2026Q1: 이자비용 (664) + 이자수익 213 = **순이자 (451)** = 매출의 -9.6%.
#       -10.7%/-13.0%/-9.0% → **-6.9%/-8.8%/-4.5%** 로 정정(순액 기준).
#   C3. **주식수 기준 오류(최대).** 2026Q1 as-reported 가중평균은 **3,884M**(EPS -$1.27)이고
#       13.09B은 **IPO 후 발행주식수**(Class A 7,488,063,555 + Class B 5,602,790,410
#       = 13,090,853,965)다. 우선주 전환(Preferred Conversion)은 **공모 완료 시점**에
#       발생하므로 2026Q2 as-reported 가중평균은 **~4.4–5.9B**에 불과하다.
#       → 프로파일은 forward 3개 분기(Q3~Q1'27)에 맞는 13.09B을 **유지**하되,
#         2026Q2 EPS는 **as-reported / 전환후 두 기준을 모두** FROZEN §(a-3)에 제시한다.
# 정정 전 sha256: 05873a91c5902537171184b6606bc7bbe1f64d11094004e509f01beb4937d817
# ##############################################################################
#
# ============================ NO_BACKTEST / LOW_SKILL ==========================
# SPCX listed 2026-06-12. Its Q2 2026 print is the FIRST EVER as a public
# company, so the number of SEC-filed *quarterly* periods available before this
# forecast is effectively ONE (2026Q1, disclosed inside the S-1/A, not a 10-Q).
# `backtest_generic` requires >= 13 quarters (engine/backtest.py:107) and is
# therefore STRUCTURALLY REFUSED here. MASE / Theil / consensus-surprise skill
# are all N/A — not "not computed yet", but *undefined*. Any number in this file
# is a forward assumption, never a fitted parameter.
#
# ======================= RESTATED-COMBINED BASIS WARNING =======================
# xAI acquired Twitter/X in 2025-03; SpaceX acquired xAI in 2026-02. Because the
# three entities were under COMMON CONTROL (Musk), the combination was accounted
# for retrospectively: the S-1 financials are RECAST back to 2023 as if the three
# had always been one company, with no PPA step-up and no goodwill. Consequence:
# **stand-alone historical SpaceX financials do not exist in comparable form**
# anywhere in the public record. Every historical figure below is on the
# "restated combined" basis and is NOT comparable to any pre-IPO press reporting
# of SpaceX revenue. Label preserved in every `source` string.
#
# LABEL CONTRACT: fiscal year ends December 31 (calendar filer; confirmed in the
# S-1/A prospectus). fiscal FY(N)Qq == model NQq, no offset, no consensus-join
# offset. No stock splits post-IPO (the 5:1 recapitalisation predates the IPO and
# is already reflected in the as-offered share counts) -> split_history empty.
#
# SCORING-TARGET NOTE (see reports/spcx_q2_2026_forecast_FROZEN.md §5): for a
# pre-profit issuer with ~13.1bn shares, GAAP diluted EPS carries almost no
# information. The FROZEN report therefore scores revenue / segments / adjusted
# EBITDA / GAAP OP / capex / FCF and demotes EPS to band-only. That redefinition
# is expressed in the REPORT, deliberately NOT here: GenericProfile is
# `extra="forbid"` and has no field for scoring targets or segments, and adding
# an SPCX-shaped one would push issuer-specific structure into the generic path
# (COMMON-DELTA §4 axis 6). Proposed schema change is filed in
# HANDOFF_CODEX_efe_2026aug_spcx.md §5 as P1, not implemented here.
