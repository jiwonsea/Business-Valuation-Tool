# overlay→DCF 실제 결합은 engine/valuation_bridge.py 워크스트림으로 위임(seam).
# CONFIRMED 2026-07-03 (user-delegated sign-off): magnitude 3~5% × confidence ≤0.40은
# 실현 below-OP 변동(±10~23% of NI) 대비 보수적 annotation으로 적정. annotation-only라
# EPS 무영향. ※ 분기 경과 시 재검토 대상 — 2026Q2 overlay는 이미 기간 종료(ex-ante 기록으로 유지).
