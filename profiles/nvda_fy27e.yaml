    business model similar to NVIDIA's software stack. 2024 consensus multiple.
- name: Marvell Technology
  segment_code: SEG1
  ev_ebitda: 16.8
  notes: Data center storage & connectivity semiconductors. Complementary to GPU infrastructure.
    Comparable revenue scale and margin profile.
- name: Intel Corporation (Data Center Division)
  segment_code: SEG1
  ev_ebitda: 12.4
  notes: Xeon processors for data centers. Lower multiple reflects market share losses
    but comparable infrastructure focus. Standalone DCG multiple ~12-14x.
- name: SK하이닉스 (SK Hynix)
  segment_code: SEG1
  ev_ebitda: 8.2
  notes: 'Korean peer: HBM memory supplier for AI accelerators. Critical component
