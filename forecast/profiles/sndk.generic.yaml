notes:
  - "라벨 계약: 6월(52/53주) 결산 → 모델 라벨 NQq = 회계 FY(N)Q(q). 동결 대상 2026Q4 = FY2026 Q4 = 2026-04-04~2026-07-03 ≈ 달력 2026 Q2. 컨센서스·리포트·테스트 모두 회계기준 라벨로 통일(NVDA/MSFT/AAPL형 조인 오프셋 리스크). tests/test_sndk_profile.py에서 명시 검증."
