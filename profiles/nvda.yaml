peers:
- name: AMD (Advanced Micro Devices)
  segment_code: SEG1
  ev_ebitda: 18.5
  notes: Direct competitor in Data Center GPU/EPYC processors. Similar AI/HPC infrastructure
    focus. 2024 EV/EBITDA based on consensus estimates.
- name: Broadcom Inc.
  segment_code: SEG1
  ev_ebitda: 22.3
  notes: Infrastructure software & semiconductor solutions for data centers. High-margin
    business model similar to NVIDIA's software stack. 2024 consensus multiple.
- name: Marvell Technology
  segment_code: SEG1
  ev_ebitda: 16.8
  notes: Data center storage & connectivity semiconductors. Complementary to GPU infrastructure.
    Comparable revenue scale and margin profile.
- name: Intel Corporation (Data Center Division)
  segment_code: SEG1
  ev_ebitda: 12.4
  notes: Xeon processors for data centers. Lower multiple reflects market share losses
    but comparable infrastructure focus. Standalone DCG multiple ~12-14x.
- name: SK하이닉스 (SK Hynix)
  segment_code: SEG1
  ev_ebitda: 8.2
  notes: 'Korean peer: HBM memory supplier for AI accelerators. Critical component
    in NVIDIA ecosystem. Lower multiple due to commodity exposure but strategic relevance.'
- name: 삼성전자 (Samsung Electronics) - Semiconductor Division
  segment_code: SEG1
  ev_ebitda: 9.7
  notes: 'Korean peer: Memory & foundry services for AI chips. Broader diversification
    but growing AI infrastructure exposure. Estimated semiconductor division multiple.'
- name: AMD Gaming (Radeon Division)
  segment_code: SEG2
  ev_ebitda: 14.2
  notes: Direct competitor in consumer GPU market. Similar gaming hardware focus.
    AMD consolidated multiple ~18x, gaming division estimated at 14-15x due to lower
    margins.
- name: Intel Arc Graphics
  segment_code: SEG2
  ev_ebitda: 11.3
  notes: Emerging consumer GPU competitor. Lower multiple reflects market share and
    profitability challenges. Integrated into Intel's broader semiconductor valuation.
- name: Qualcomm Inc. (Gaming SoC)
  segment_code: SEG2
  ev_ebitda: 13.8
  notes: Mobile gaming processors (Snapdragon). Different form factor but comparable
    consumer gaming focus. Qualcomm consolidated ~13-14x, gaming component estimated
    similarly.
- name: Sony Group Corporation (PlayStation Hardware)
  segment_code: SEG2
  ev_ebitda: 9.5
  notes: Gaming platform hardware manufacturer. Lower multiple reflects hardware commodity
    nature and lower margins vs. GPU design. 2024 Sony consolidated multiple ~9-10x.
- name: Corsair Gaming Inc.
  segment_code: SEG2
  ev_ebitda: 8.1
  notes: Gaming hardware peripherals & components. Broader consumer electronics exposure.
    Lower multiple reflects hardware commodity risk and lower margins.
- name: Qualcomm Inc. (Automotive SoC)
  segment_code: SEG3
  ev_ebitda: 13.8
  notes: Automotive semiconductor leader (Snapdragon Ride). Similar embedded/automotive
    focus. Qualcomm consolidated ~13-14x, automotive component estimated at similar
    range.
- name: NXP Semiconductors
  segment_code: SEG3
  ev_ebitda: 15.2
  notes: Leading automotive semiconductor supplier. Direct competitor in automotive
    embedded systems. 2024 consensus EV/EBITDA ~15-16x reflects automotive growth
    and margin profile.
- name: Synopsys Inc.
  segment_code: SEG3
  ev_ebitda: 28.5
  notes: Design tools & IP for semiconductor design. Complementary to NVIDIA's visualization/design
    tools. Premium multiple reflects software/IP nature and recurring revenue.
- name: Cadence Design Systems
  segment_code: SEG3
  ev_ebitda: 26.8
  notes: EDA software for chip design. Similar professional visualization/design tool
    focus. Premium multiple reflects software business model and high margins.
- name: SK텔레콤 (SK Telecom) / 현대모비스 (Hyundai Mobis)
  segment_code: SEG3
  ev_ebitda: 7.3
  notes: Korean automotive electronics exposure. Hyundai Mobis involved in automotive
    systems. Lower multiple reflects broader automotive/electronics diversification
    vs. pure semiconductor focus.
- name: Xilinx (now AMD subsidiary)
  segment_code: SEG3
  ev_ebitda: 16.9
  notes: FPGA & adaptive computing for automotive/industrial. Professional visualization
    & embedded systems focus. Pre-acquisition multiple ~17x reflected specialized
    semiconductor premium.
news_key_issues: '- [기회] NVIDIA, Microsoft, AWS가 군사용 AI 기술 확장에 관한 계약 체결 (2026-05-01)

  - [기회] NVIDIA의 Nemotron 3 Nano Omni 모델 출시로 효율적인 AI 에이전트 개발 가능 (2026-04-28)

  - [경쟁] Alphabet의 시가총액이 5조 달러에 근접, NVIDIA를 추월할 가능성 (2026-05-02)

  - [기회] LG Electronics와의 로봇, AI 데이터 센터, 모빌리티 분야 협력 논의 (2026-04-29)

  - [리스크] 중국의 서버 수요 감소로 NVIDIA의 수익에 부정적인 영향 가능 (2026-05-01)

  - [기회] 펜타곤과 군사용 AI 기술 개발 계약 체결 (2026-05-01)

  - [기회] Bank of America의 NVIDIA 매수 권고 (2026-05-01)'
news_drivers:
- id: military_ai_expansion
  name: 군사용 AI 기술 확장 계약
  category: company
  effects:
    growth_adj_pct: 15
    market_sentiment_pct: 8
  rationale: Microsoft, AWS와의 군사용 AI 계약 및 펜타곤 계약은 새로운 고마진 수익원 창출. 정부 계약의 안정성과 높은 진입장벽으로
    프리미엄 밸류에이션 정당화. 역사적으로 국방 기술 계약은 15-25% 매출 성장 기여
- id: china_demand_decline
  name: 중국 서버 수요 감소
  category: industry
  effects:
    growth_adj_pct: -12
    wacc_adj: 0.3
  rationale: 중국은 NVIDIA 매출의 약 20-25% 차지. 서버 수요 감소는 데이터센터 사업 성장률 둔화 직결. 지정학적 리스크 증가로
    리스크 프리미엄 상승. 과거 중국 수요 충격 시 성장률 10-15% 하락 경험
- id: alphabet_competition
  name: Alphabet 시총 추월 위협
  category: industry
  effects:
    market_sentiment_pct: -5
    wacc_adj: 0.2
  rationale: Alphabet의 5조달러 시총 근접은 AI 반도체 시장 경쟁 심화 신호. TPU 등 자체 칩 개발로 NVIDIA 의존도 감소
    가능성. 시장 리더십 위협으로 멀티플 압축 우려
- id: ai_platform_innovation
  name: Nemotron 3 Nano Omni 출시
  category: company
  effects:
    growth_adj_pct: 8
    market_sentiment_pct: 5
  rationale: 효율적인 AI 에이전트 개발 플랫폼은 소프트웨어 매출 확대와 하드웨어 동반 성장 견인. 플랫폼 생태계 강화로 고객 락인 효과
    증대. 신제품 출시 시 평균 5-10% 성장률 개선 효과
