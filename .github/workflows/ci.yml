name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install pinned dependencies
        run: |
          pip install -r requirements-lock.txt
          pip install -e ".[dev,test]"

      - name: Ruff lint
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .

      - name: Run tests
        run: pytest tests/ calibration/tests/ -v --tb=short

  forecast-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install forecast dependencies
        run: pip install -e ".[dev,forecast]"

      - name: Install pinned Ruff
        run: pip install ruff==0.15.8

      - name: Ruff forecast error checks
        working-directory: forecast
        run: ruff check . --select E9,F63,F7,F82

      - name: Run forecast tests
        run: pytest forecast/tests -v --tb=short
