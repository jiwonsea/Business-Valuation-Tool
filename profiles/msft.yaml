  effects:
    growth_adj_pct: -8
    wacc_adj: 0.3
    market_sentiment_pct: -5
  rationale: AI 데이터센터 에너지 소비 급증으로 ESG 목표 달성 비용 증가. 유사 사례(구글 2019년 에너지 목표 연기) 시 성장률
    5-10% 하락, 리스크 프리미엄 20-30bp 상승 관찰
- id: ai_business_expansion
  name: AI 기술 활용 신규 비즈니스 모델 개발
  category: company
  effects:
    growth_adj_pct: 15
    wacc_adj: -0.2
    market_sentiment_pct: 8
  rationale: 생성형 AI 기반 신규 수익원 창출. 과거 클라우드 전환기(2014-2018) 유사 혁신 시 EBITDA 성장률 10-20%
    상승, 투자자 신뢰도 증가로 리스크 프리미엄 감소
- id: institutional_selling
  name: 헤지펀드 TCI 지분 감소
  category: company
  effects:
    market_sentiment_pct: -4
    wacc_adj: 0.1
  rationale: 대형 기관투자자 매도는 단기 유동성 압박 야기. TCI 규모($40B+ AUM) 고려 시 주가 압박 2-5% 예상, 소폭 리스크
    프리미엄 상승
- id: ai_regulation_clarity
  name: 정부 AI 모델 사전 검토 허용
  category: industry
  effects:
    growth_adj_pct: 5
    market_sentiment_pct: 3
    wacc_adj: -0.1
  rationale: 규제 명확성 제고로 AI 투자 불확실성 감소. 과거 GDPR 등 규제 명확화 시 기술주 밸류에이션 3-7% 상승, 규제 리스크
    프리미엄 감소
- id: strong_q3_growth
  name: 3분기 매출 18% 증가
  category: company
  effects:
    growth_adj_pct: 10
    market_sentiment_pct: 6
  rationale: 18% 성장은 컨센서스 15% 대비 상회. 과거 실적 서프라이즈 시 향후 4분기 성장률 5-12% 상향 조정, 투자심리 개선
    효과
