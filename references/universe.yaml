# Selection universe for the weekly target selection (S1). Read by scheduler/universe.py.
#
# coverage: pilot - 30 companies only (K-1B). This is not the whole KOSPI200 + S&P500
# universe: a market-cap rank taken inside this file is not an operating value.
#
# sector, is_financial and semis_equipment are this repository's own classification,
# written by hand. industry_code is the raw KSIC (DART) or SIC (SEC) code, kept as a
# record; is_financial is not derived from it, and the two can disagree (UNH: SIC 6324
# lies in the SIC range read as financial, and a health insurer is not financial here).
# basis is left out: index membership was not checked.
#
# Quote ticker and dart_corp_code: unquoted 000660 is the integer 432 to YAML.
