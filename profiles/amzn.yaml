    benchmark.
- name: The Trade Desk Inc (TTD)
  segment_code: SEG4
  ev_ebitda: 16.5
  notes: Programmatic advertising platform (DSP/SSP); B2B model similar to Amazon
    Ads infrastructure. 2024E EBITDA margin ~18-20%. High growth, lower margin than
    pure-play ad networks.
- name: Criteo SA (CRTO)
  segment_code: SEG4
  ev_ebitda: 9.2
