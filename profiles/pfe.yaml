  \ 중국 의료보험 통과로 GLP-1 약물 시장 진출 (6월 29일)\n  → 중국 시장 성장성 확보\n\n- [배당] 7% 배당 수익률 유지로\
  \ 배당주 매력도 지속 (7월 23일)\n  → 주주 환원 정책 강화\n\n## 부정적 요인\n- [리스크] COVID-19 백신 기술 관련 국제\
  \ 특허소송 다수 제기 (7월 20-22일)\n  → 법적 비용 증가 및 지적재산권 리스크\n\n- [리스크] 아칸소주, 약가 할인 접근성 문제로\
  \ Pfizer 등 제약사 고소 (7월 23일)\n  → 규제 리스크 및 약가 압박 우려\n\n- [리스크] Sanofi의 RSV 백신 관련 폄하\
  \ 발언 논란 (7월 22일)\n  → 경쟁사 제품 평가 논쟁으로 평판 리스크\n\n- [시장] 주가 광범위 시장 대비 약세 지속 (7월 6-20일)\n\
  \  → 투자자 심리 약화 신호"
