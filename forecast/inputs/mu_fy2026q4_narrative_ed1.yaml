company:
  ko:
  - Micron은 DRAM·NAND 메모리와 저장장치를 만드는 미국 반도체 회사다. 사업은 클라우드 메모리(CMBU), 코어 데이터센터(CDBU), 모바일·클라이언트(MCBU), 자동차·임베디드(AEBU) 네 개 사업부로 공시된다. FQ4 FY26 매출은 {{fact:is.revenue.FY2026Q4.A-8K}}였고, DRAM이 매출의 73%를 차지했다(준비문 p.7).
  - FY2026은 53주이고 FQ4는 14주다. 13주인 다른 분기와 비교할 때는 주당 기준(14주 매출 ÷ 14, 13주 매출 ÷ 13)으로 맞춘 성장률을 함께 적는다.
  - '이 리포트의 숫자는 세 층으로 나뉜다. ① PREREG_A: 발표 전에 동결한 예측(수정하지 않음). ② A-8K: 회사가 발표한 실적(10-K 접수 전 잠정값). ③ RLE: 발표 후 가이던스에 앵커를 둔 본 저자의 추정. 표와 차트의 열 머리에 어느 층인지 표시한다.'
  - 'UNAVAILABLE은 계산하지 않기로 정한 칸이다(예: RLE 재무상태표). 값을 지어내지 않기 위한 표시이며, 사유는 각 표 아래 각주에 적는다.'
  en:
  - 'Micron is a US semiconductor company making DRAM and NAND memory and storage. It reports four business units: Cloud Memory (CMBU), Core Data Center (CDBU), Mobile and Client (MCBU), and Automotive and Embedded (AEBU). FQ4 FY26 revenue was {{fact:is.revenue.FY2026Q4.A-8K}}, with DRAM at 73% of revenue (prepared remarks p.7).'
  - FY2026 has 53 weeks and FQ4 has 14. When comparing with 13-week quarters, growth is also shown on a per-week basis (14-week revenue ÷ 14 versus 13-week revenue ÷ 13).
  - 'Numbers in this report sit in three layers: ① PREREG_A, the forecast frozen before the print (never altered); ② A-8K, company-reported actuals (provisional until the 10-K); ③ RLE, the author''s estimates anchored on post-print guidance. Each table and chart header states its layer.'
  - UNAVAILABLE marks cells the rules deliberately do not compute (for example, the RLE balance sheet). It avoids inventing values; each table footnote gives the reason.
fq4_reading:
  ko:
  - term: 가이던스 라벨 적중
    text: 발표 전에 지표마다 '무차이 범위'를 정했다(매출 {{fact:guidance.revenue_lo.FQ4FY26}}–{{fact:guidance.revenue_hi.FQ4FY26}}, GAAP GM 가이던스 ±1pt 등). 실제가 범위 위면 '상단 초과', 안이면 '범위 안', 아래면 '하단 미달'이다. 사전등록 예측이 같은 라벨을 냈으면 적중이다.
  - term: 밴드 커버리지
    text: 실제값이 사전등록한 약세–강세 범위 안에 들었는지 본다. 범위 밖이면 예측의 불확실성 폭이 너무 좁았다는 뜻이다.
  - term: 차기 분기 방향(SF7)
    text: FQ1 FY27 가이던스가 FQ4 대비 주당 ±2% 안이면 보합, 위면 성장, 아래면 감소로 판정한다. 사전등록 예측은 보합이었고, 실제 가이던스는 주당 {{fact:derived.weekly_growth.FQ1FY27_guide}} 성장이어서 MISS다.
  en:
  - term: Guidance-label hit
    text: Before the print, each metric got a 'no-difference range' (revenue {{fact:guidance.revenue_lo.FQ4FY26}}–{{fact:guidance.revenue_hi.FQ4FY26}}, GAAP GM guidance ±1pt, etc.). Above the range is 'above high', inside is 'in range', below is 'below low'. A hit means the pre-registered forecast gave the same label.
  - term: Band coverage
    text: Checks whether the actual fell inside the pre-registered bear–bull range. Falling outside would mean the forecast's uncertainty band was too narrow.
  - term: Next-quarter direction (SF7)
    text: FQ1 FY27 guidance within ±2% per week of FQ4 is flat; above is growth; below is decline. The pre-registered call was flat; actual guidance implied {{fact:derived.weekly_growth.FQ1FY27_guide}} per-week growth, so it missed.
gm_compression:
  ko:
  - GAAP 매출총이익률(GM)이 가이던스 중간값을 넘은 폭이 FQ2 FY26 {{fact:derived.gm_beat.FQ2-26}}에서 FQ3 {{fact:derived.gm_beat.FQ3-26}}, FQ4 {{fact:derived.gm_beat.FQ4-26}}로 빠르게 줄었다. 같은 기간 GM의 전 분기 대비 상승 폭도 줄었다.
  - FQ1 FY27 GAAP GM 가이던스는 {{fact:guidance.gm_gaap.FQ1FY27}}로 FQ4 실제보다 낮다. 회사는 FQ4에 늘린 인센티브 보상이 재고에 흡수되어 FQ1 GM에 반영되기 때문이며, FQ1이 FY27의 바닥이라고 설명했다(준비문 p.9).
  - '해석: GM은 이미 높은 수준이어서 추가 상승 여지가 작고, 회사도 가격 상승률 둔화를 말했다. 상회 폭이 더 줄거나 음(−)으로 바뀌면 가격 사이클 둔화의 첫 신호로 본다. 이 신호는 리스크 절의 ''가격 사이클'' 관측 항목과 연결된다.'
  en:
  - The amount by which GAAP gross margin (GM) beat the guidance midpoint shrank quickly, from {{fact:derived.gm_beat.FQ2-26}} in FQ2 FY26 to {{fact:derived.gm_beat.FQ3-26}} in FQ3 and {{fact:derived.gm_beat.FQ4-26}} in FQ4. The quarter-on-quarter rise in GM narrowed over the same period.
  - FQ1 FY27 GAAP GM guidance is {{fact:guidance.gm_gaap.FQ1FY27}}, below FQ4 actual. Management attributes this to higher FQ4 incentive compensation absorbed into inventory and flowing into FQ1 GM, and calls FQ1 the FY27 floor (prepared remarks p.9).
  - 'Reading: GM is already high, leaving little room to rise, and management has flagged slower price increases. A further shrinking or negative beat would be the first sign of a slowing price cycle; this links to the ''price cycle'' watch item in the risks section.'
price_bit_note:
  ko:
  - '회사는 가격·비트 출하 변화를 숫자가 아니라 ''high-teens %'', ''mid-single-digit'' 같은 구간 표현으로만 공개한다(준비문 p.7). 차트는 이 구간을 범위 막대로 그리며, 환산 규칙(예: high-teens = 16–19%)은 차트 각주에 적는다. 환산은 본 저자의 판단이며 회사 수치가 아니다.'
  en:
  - Micron discloses price and bit-shipment changes only as range wording such as 'high-teens %' or 'mid-single-digit' (prepared remarks p.7). The chart draws these ranges as bars; the conversion rule (e.g., high-teens = 16–19%) is in the chart footnote. The conversion is the author's judgement, not a company figure.
business_structure:
  ko:
  - FQ4 FY26 사업부별 매출은 CDBU $18.0B(33%), CMBU $16.3B(30%), MCBU $13.1B(24%), AEBU $6.8B(13%)였다. 네 사업부 모두 사상 최대였고, 전 분기 대비 증가율은 CDBU 56%, AEBU 47%, CMBU 18%, MCBU 14%였다(준비문 p.7–8).
  - 사업부 GM은 CDBU·MCBU 90%, AEBU 84%, CMBU 83%다. CMBU만 전 분기와 같았는데, 회사는 가격 상승을 HBM 비중 증가가 상쇄했다고 설명했다(준비문 p.7). 회사는 2027년 HBM 물량 대부분을 전년보다 크게 오른 가격으로 계약해 일반 DRAM과의 GM 차이가 좁아지고 있다고 했다(준비문 p.4).
  - 제품별로는 DRAM $39.8B(73%), NAND $14.1B(26%)다. 데이터센터 SSD 매출은 $10B에 가까워 NAND 매출의 2/3를 넘었다(준비문 p.4·p.7).
  - '해석: 매출의 63%가 데이터센터 사업부(CMBU·CDBU)에서 나온다. 따라서 이 리포트의 핵심 변수는 서버·AI 수요와 DRAM 가격이다. MCBU는 출하 비트가 줄었는데도 가격으로 매출이 늘었다(준비문 p.7). 가격이 꺾이면 비트 성장이 약한 사업부의 매출이 먼저 줄어들 수 있다.'
  en:
  - 'FQ4 FY26 revenue by business unit was CDBU $18.0B (33%), CMBU $16.3B (30%), MCBU $13.1B (24%) and AEBU $6.8B (13%). All four were records; sequential growth was CDBU 56%, AEBU 47%, CMBU 18% and MCBU 14% (prepared remarks p.7–8).'
  - 'Business-unit GM was 90% for CDBU and MCBU, 84% for AEBU and 83% for CMBU. Only CMBU was flat sequentially; management said higher HBM mix offset higher pricing (prepared remarks p.7). Management also said most 2027 HBM supply is contracted at significantly higher prices year over year, narrowing the GM gap with conventional DRAM (prepared remarks p.4).'
  - 'By product, DRAM was $39.8B (73%) and NAND $14.1B (26%). Data center SSD revenue was close to $10B, over 2/3 of NAND revenue (prepared remarks p.4, p.7).'
  - 'Reading: 63% of revenue comes from the data center units (CMBU, CDBU), so the key variables in this report are server and AI demand and DRAM pricing. MCBU revenue rose on price despite lower bit shipments (prepared remarks p.7). If pricing turns, units with weak bit growth may see revenue fall first.'
methodology:
  ko:
  - 숫자의 세 층은 섞지 않는다. PREREG_A는 발표 전에 동결해 이후 고치지 않았고, 발표 후 실적(A-8K)과 같은 기준으로 채점했다(SCORED). RLE는 채점이 끝난 뒤 회사 가이던스를 출발점으로 만든 추정이며, 예측 성능의 근거로 쓰지 않는다.
  - A-8K는 보도자료(8-K)의 잠정 실적이다. 10-K가 접수되면 같은 항목을 대조하고, 차이가 있으면 다음 판에서 고친다. A-10K는 10-K 기준 실적을 뜻한다.
  - '근거 등급: E는 회사 공시나 사전등록 문서에 있는 값, D는 그 값으로 계산한 값, J는 저자의 판단이다. J가 들어간 값은 표와 그림 각주에 표시한다.'
  - '정보 경계: 정보 컷오프 이후 자료는 쓰지 않았다. 증권사 리포트의 수치와 의견은 쓰지 않았고, 컨센서스는 무료로 검증할 수 있는 출처가 없어 UNAVAILABLE로 둔다. 투자의견, 목표주가, 시나리오 확률은 제시하지 않는다.'
  - '검증: KO판과 EN판의 숫자 일치, 재무제표 항등식, 입력 파일 해시를 자동으로 검사하고, 전 쪽을 이미지로 확인한 뒤 발행한다.'
  en:
  - The three layers of numbers are never mixed. PREREG_A was frozen before the print and not altered afterwards, then scored against post-print actuals (A-8K) on the same basis (SCORED). RLE is an estimate built after scoring, starting from company guidance, and is not evidence of forecasting skill.
  - A-8K is the provisional result from the press release (8-K). When the 10-K is filed, the same items are checked and any differences are corrected in the next edition. A-10K means 10-K-based actuals.
  - 'Evidence grades: E is a value found in company filings or the pre-registration documents, D is a value calculated from those, and J is the author''s judgement. Values involving J are flagged in table and figure footnotes.'
  - 'Information boundary: no material after the information cutoff is used. Broker report figures and opinions are not used, and consensus is UNAVAILABLE because no free, verifiable source exists. No rating, price target or scenario probabilities are given.'
  - 'Checks: KO/EN number parity, financial statement identities and input file hashes are tested automatically, and every page is checked as an image before publication.'
