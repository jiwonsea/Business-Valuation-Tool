window:
  start_quarter: "2026Q4"          # FY2026 Q4 — the frozen target
  n_quarters: 4                    # FY26Q4, FY27Q1, FY27Q2, FY27Q3

# ---------------------------------------------------------------------------
# Forward scenarios — POSITIONAL from the seed: [FY26Q4, FY27Q1, FY27Q2, FY27Q3]
#
# R1 ANCHOR RULE, APPLIED IN THE *UPWARD* DIRECTION (DELTA §R1 반전 경고):
#   level  = latest actual (FY26Q3) and company guidance (2026-04-30), never a
#            historical average. The 8-quarter mean GAAP op margin is ~ -0.7%;
#            using it would understate FY26Q4 operating income by ~100%.
#   shape  = seasonal vector, DOWN-WEIGHTED to ~zero. SanDisk's realised
#            per-slot QoQ dispersion (FQ3: -9.7% .. +96.7%) is cycle, not
#            season; there is no stable seasonal signal to carry. The seasonal
#            vector is therefore kept ONLY in backtest_methodology and is NOT
#            reused forward. This judgement is recorded here rather than as a
#            YAML weight parameter — see notes / Codex question §6.
#
# GUIDANCE (FQ4 FY26, 8-K EX-99.1 2026-04-30): revenue $7,750-8,250M;
#   GAAP GM 78.9-80.9%; GAAP opex $523-558M; GAAP interest & other net
#   +$12 to +$32M; non-GAAP tax $775-875M; NON-GAAP diluted EPS $30.00-33.00;
#   diluted shares ~158M. No GAAP EPS guidance was given.
#
# GUIDANCE-BEAT TRACK RECORD (4/4, escalating; actual vs guidance MIDPOINT):
#   FQ4'25 +5.6% · FQ1'26 +7.3% · FQ2'26 +16.3% · FQ3'26 +29.3% (revenue)
#   and vs guidance HIGH end: +2.8% · +4.9% · +14.2% · +24.0%.
#   Non-GAAP EPS beat the guidance HIGH end all four quarters.
#
# EXTERNAL READ-THROUGH (published BEFORE this freeze):
#   Kioxia (Flash Ventures JV partner, same fabs, near-identical window)
#   reported 2026-07-31: Apr-Jun 2026 net sales Y1,767.1B, +76.2% QoQ, blended
#   ASP +70% QoQ, bit shipments +1-3% QoQ, non-GAAP OP margin 75.0%.
#   Jan-Mar 2026 Kioxia was +84.5% QoQ vs SanDisk FY26Q3 +97% QoQ -> the two
#   did NOT diverge in the prior quarter, so Kioxia's +76% is a genuine SECOND
#   leg, not delayed catch-up. TrendForce 2026-07-03: 3Q26 NAND contract prices
#   decelerate to +10-15% QoQ from +70-75% in 2Q26.
# ---------------------------------------------------------------------------
base:
  probability: 0.50
  rationale: "FY26Q4 매출 $9,044M(+52.0% QoQ) — 가이던스 중간값 $8,000M 대비 +13.1%, 컨센 $8.35B 대비 +8.3%. 근거: ①동일 팹 파트너 키옥시아가 사실상 같은 창(4~6월)에 +76.2% QoQ·ASP +70%·비트 +1~3%를 실제로 찍었고, 직전 분기(1~3월)에 두 회사가 벌어지지 않았으므로 이는 지연 캐치업이 아니라 2차 상승 레그다. ②SNDK는 4/4 분기 가이던스 상단을 상회했고 상회폭이 단조 확대(+2.8→+4.9→+14.2→+24.0%). ③경영진 스스로 '초기이고 매우 역동적이라 보수적으로 잡는 게 낫다'고 발언. 다만 컨슈머(FQ3 $820M, 매출의 14%, QoQ −10%)가 가격저항 구간이고 SNDK의 FQ3 ASP(+~140%)가 키옥시아(+~105%)보다 이미 앞서 나가 헤드룸이 작다는 점을 반영해 키옥시아 패리티(+68%)보다 낮춰 잡았다. GAAP GM 84.0%(매출은 ASP, COGS는 비트로 움직여 오퍼레이팅 레버리지가 GM을 가이던스 78.9~80.9% 위로 밀어올림; FQ3에도 가이던스 대비 +12.5%p 상회), GAAP opex $555M(가이던스 $523~558M 상단, 주가 급등에 따른 SBC), GAAP 영업이익률 77.9%. 세율 13.5%(가이던스 함의 비GAAP 13.9%와 정합). below-OP는 R2에 따라 base 0."
  revenue_growth_qoq: [0.520, 0.180, 0.080, 0.000]
  op_margin: [0.779, 0.785, 0.780, 0.760]
  effective_tax_rate: [0.135, 0.150, 0.150, 0.150]
  net_interest_pct_of_revenue: [0.0, 0.0, 0.0, 0.0]
bear:
