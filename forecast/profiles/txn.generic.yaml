window:
  start_quarter: "2026Q2"
  n_quarters: 4

# Regime break at the cyclical-recovery inflection. Two structural shifts align at
# 2025: (1) the 300mm/CHIPS depreciation ramp permanently reset gross margin lower
# (~70% in 2022 → ~58% in 2025), and (2) demand troughed in FY2024 (NI $4.8B) and
# began recovering in 2025. The forward window EXTENDS this post-2025 regime, so
# the post-break window is the relevant skill read; the pre-break down-cycle (2021
# peak margins → 2024 trough) is a different margin regime that fixed forward
# op_margin assumptions cannot track (the known backtest↔forward coupling). All
# three windows are reported transparently. Post-break N is small (recovery is
# young) — treat as indicative.
regime_break_quarter: "2025Q1"

# Forward scenarios: cyclical recovery off the 2024 trough (FY24 NI $4.8B) led by
# industrial (+30% YoY, +20% QoQ in Q1'26) and data center; automotive flat/near
# peak. QoQ growth vectors are in FORWARD order [2026Q2, 2026Q3, 2026Q4, 2027Q1]
# and traverse the natural TXN season (Q2 up, Q3 up, Q4 down, Q1 ~flat).
# op_margin reflects operating leverage: GM rises with utilization (75-85%
# ex-depreciation incremental fall-through, mgmt Q1'26 call) while the 300mm/CHIPS
# depreciation ramp (~$2.2-2.4B FY26, ~flat QoQ) caps the upside. net_interest_pct
# is NEGATIVE: TXN's below-OP block (net interest + OI&E) subtracts ~1.8% of
# revenue (Q1'26: OP $1,808M → pretax $1,714M). tax ~13% (Q2'26 mgmt guide).
#
# NOTE (backtest↔forward slot coupling): backtest_generic indexes the base vector
# by CALENDAR slot (Q1→[0]..Q4→[3]); the forward path indexes by step-from-seed
# (seed=2026Q1 → 2026Q2 uses [0]). With a Q1 seed these differ by one seasonal
# position, so the 1-step backtest is seasonally offset for TXN and understates
# skill — the FROZEN forecast is calibrated for the FORWARD path (the scored
# artifact). See reports/txn_q2_2026_forecast_FROZEN.md.
base:
  probability: 0.50
  rationale: "산업+데이터센터 주도 회복 지속, 자동차 flat. Q2'26 매출 회사 가이던스 미드(~$5.2B)/컨센($5.24B) 근처. 가동률 상승으로 OP마진 ~40%까지 개선, 감가상각 램프가 상단 제약. 세율 ~13%."
  revenue_growth_qoq: [0.083, 0.035, -0.030, 0.020]
  op_margin: [0.400, 0.410, 0.390, 0.375]
  effective_tax_rate: 0.13
  net_interest_pct_of_revenue: -0.018
bear:
  probability: 0.25
  rationale: "회복 둔화·자동차 재약세, 채널 재고 조정. Q2'26 매출 가이던스 하단(~$5.0B) 근처, 가동률 부진+감가상각 부담으로 GM/OP마진 정체(~37%). EPS 가이던스 하단 하회 리스크."
  revenue_growth_qoq: [0.036, 0.010, -0.050, 0.010]
  op_margin: [0.370, 0.375, 0.355, 0.350]
  effective_tax_rate: 0.13
  net_interest_pct_of_revenue: -0.018
bull:
  probability: 0.25
  rationale: "산업 secular 재가속 + 데이터센터 강세, 가동률 급등으로 ex-감가 fall-through 80%+ 실현. Q2'26 매출 가이던스 상단(~$5.4B), OP마진 42%+. EPS 컨센/가이던스 상단 상회."
  revenue_growth_qoq: [0.115, 0.050, -0.020, 0.030]
  op_margin: [0.420, 0.430, 0.410, 0.400]
  effective_tax_rate: 0.13
  net_interest_pct_of_revenue: -0.018

