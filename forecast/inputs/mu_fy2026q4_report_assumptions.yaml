post_print_change:
  A3_base:
    original:
      value: "FQ1 = M1; then -0.5 percentage point per quarter"
      source_id: SRC-HANDOFF-R9-R12
    change:
      value: "FQ1 = M1; then flat through FQ4; retain -0.5 point path as preregistered sensitivity"
      source_id: SRC-HANDOFF-R9-R12
    reason:
      value: "Prepared remarks identify FQ1 as the FY2027 gross-margin floor and state that later quarters should be higher; flat is a conservative no-new-number implementation."
      source_id: SRC-REMARKS-FQ4FY26
    page:
      value: 9
      source_id: SRC-REMARKS-FQ4FY26
    grade:
      value: "direction E; magnitude J"
      source_id: SRC-HANDOFF-R9-R12
  A4_opex:
    original:
      value: "FY2026 GAAP opex * 52/53 + 1000; FQ1=X1; allocate the remainder 30:33:37"
      source_id: SRC-HANDOFF-R9-R12
    change:
      value: "(6841 non-GAAP opex + 2500) + 253*4 = 10353; quarterly 2310/2413/2654/2976"
      source_id: SRC-HANDOFF-R9-R12
    reason:
      value: "Prepared remarks give an approximately 2500 FY2027 increase on the document's non-GAAP basis. The 253 quarterly GAAP add-on is the FQ1 stock-compensation difference: R&D 166 plus SG&A 87."
      source_id:
        - SRC-REMARKS-FQ4FY26
        - SRC-EX991-FQ4FY26
    page:
      value: 9
      source_id: SRC-REMARKS-FQ4FY26
    grade:
      value: "increase E; GAAP conversion and allocation J"
      source_id: SRC-HANDOFF-R9-R12
  A14_net_capex:
    original:
      value: "FQ4 actual net capex * 1.05, flat; replace if numerical FY2027 guidance is issued"
      source_id: SRC-HANDOFF-R9-R12
    change:
      value: "11500/13500/12500/12500; FY2027 total 50000; FY2028 total 50000"
      source_id: SRC-HANDOFF-R9-R12
    reason:
      value: "Prepared remarks give FQ1 about 11500 and first-half about 25000, and say second-half capex will be higher. Setting second half equal to first half is a disclosed lower bound that biases FCF high."
      source_id: SRC-REMARKS-FQ4FY26
    page:
      value: 10
      source_id: SRC-REMARKS-FQ4FY26
    grade:
      value: "FQ1 and first half E; second-half lower bound J"
      source_id: SRC-HANDOFF-R9-R12

interpretation_note:
  A11_net_capex_roll_forward:
    original_interpretation:
      value: "The R6 label gross capex required projected D&A to remain UNAVAILABLE because FY2027 guidance is net of anticipated government incentives."
      source_id: SRC-HANDOFF-R9-R12
    corrected_interpretation:
      value: "Use net capex in the PP&E roll-forward: PPE_end = PPE_begin + net_capex - D&A; quarterly D&A = (d/4) * average(PPE_begin, PPE_end)."
      source_id: SRC-HANDOFF-R9-R12
    evidence:
      value: "The FY2025 10-K states that government incentives related to capital expenditures reduce property, plant and equipment."
      source_id: SRC-10K-FY25
    limitation:
      value: "The timing difference between receipt of incentives and the PP&E reduction, including the FY2026 noncurrent unearned government incentive balance of 786, is not modeled."
      source_id:
        - SRC-10K-FY25
        - SRC-EX991-FQ4FY26

