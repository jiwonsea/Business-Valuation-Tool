# Advanced Micro Devices (AMD) — generic top-down forecast profile.
# x86 CPU / AI accelerator / adaptive-SoC issuer. Revenue is NOT DRAM bits x ASP,
# so it uses the generic path (schemas/generic.py), not the memory engine.
#
# DATA PROVENANCE (AMD-1, 2026-08-05 KST): `actuals` are OFFICIAL standalone
# quarters from EDGAR companyfacts as-filed originals (10-Q; Q4 = 10-K annual
# minus same-FY 9M 10-Q, same accession pair — no disclosure-vintage mixing).
# The Cowork sandbox proxy 403s data.sec.gov for processes, so the facts were
# transcribed from WebFetch companyconcept slices (as-filed original accessions
# only) for CIK 0000002488:
#   RevenueFromContractWithCustomerExcludingAssessedTax / GrossProfit /
#   OperatingIncomeLoss / NetIncomeLoss / IncomeTaxExpenseBenefit /
#   WeightedAverageNumberOfDilutedSharesOutstanding
# VERIFIED (all green, 9 quarters 2024Q1..2026Q1):
#   - FY-sum identity revenue: 5473+5835+6819+7658 = 25,785 = FY2024 10-K
#                              7438+7685+9246+10270 = 34,639 = FY2025 10-K
#   - FY-sum identity net income: 123+265+771+482 = 1,641 = FY2024 10-K
#                                 709+872+1243+1511 = 4,335 = FY2025 10-K
#   - EPS coherence: derived net_profit/diluted_shares reproduces every as-filed
#     GAAP diluted EPS to the reported cent (0.07/0.16/0.47/0.29/0.44/0.54/
#     0.75/0.92/0.84).
#   - Label contiguity 2024Q1..2026Q1, no Q3->Q1 join.
# Regenerate on host with: python scripts/build_generic_actuals.py --cik 2488
# --fye-month 12 --start 2024Q1 --end 2026Q1  (host: delete any derived cache
# first and refetch the full blob via fetch_companyfacts(2488), with
# SEC_EDGAR_USER_AGENT set). SHA-256 of the source bytes is NOT established in
# this session — WebFetch returns a markdown conversion, not the original bytes
# (START-COMMON §7 sandbox carve-out). "바이트 보존 미완 — 호스트 필요".
#
# EPS is NOT stored: it is DERIVED at load from net_profit / diluted_shares —
# see schemas/generic.py. As-filed EPS + accession are preserved in each row's
# source string.
#
# LABEL CONTRACT: AMD's fiscal year ends on the last Saturday of December
# (2024-12-28, 2025-12-27) → calendar filer, fiscal FY(N)Qq == model NQq
# (identity, no offset). No ~1-month consensus-join offset (unlike NVDA Jan /
# MSFT Jun / AAPL Sep). No stock splits in the covered window (split_history
# empty; the last AMD split was 2000).
#
# TWO SHARE-COUNT ROWS ARE DERIVED, NOT AS-FILED: AMD tags only a YTD weighted
# -average diluted share count in its Q4/10-K facts, so 2024Q4 and 2025Q4 use
# Q4 = 4 x FY_avg - 3 x 9M_avg. 2025Q4 was then cross-checked against the Q4'25
# press-release table (1,649M) and the press-release value is the one stored.
# 2024Q4's derived 1,634M reproduces the as-reported $0.29 GAAP EPS exactly.
name: "Advanced Micro Devices, Inc."
name_kr: "AMD"
ticker: "AMD"
currency: "USD"
reporting_unit: "USD_million"
fiscal_year_end_month: 12         # calendar filer (last Saturday of December)

# FORWARD-ONLY assumption: 2026Q2 weighted-average diluted share count.
# Trend is steadily UP (buybacks are outrun by SBC + convertible/warrant
# dilution): 1,626 -> 1,630 -> 1,641 -> 1,649 -> 1,650 over the last 5 quarters
# (+0.15% to +0.68% QoQ). 1,658M = 1,650 x 1.0048, the trailing-4Q mean drift.
# ⚠ SF3 RISK: the OpenAI strategic warrant (reported up to ~160M shares) could
# NOT be located in the 2026Q1 10-Q (0000002488-26-000076) in this session, so
# neither its dilution timing nor its P&L classification (contra-revenue vs
# expense vs equity) is confirmed. This number therefore carries UNQUANTIFIED
# upside risk to share count / downside risk to revenue. See notes + FROZEN §(f).
# Historical actuals use per-quarter as-filed shares instead.
weighted_avg_diluted: 1658000000

seed:
  quarter_label: "2026Q1"
  revenue_total: 10253
  net_profit: 1383
  eps_diluted: 0.84

# Official standalone quarters, contiguous 2024Q1..2026Q1 (9 rows, Q4 restored
# as 10-K annual − same-FY 9M 10-Q). VERIFIED: FY-sum identity (rev & NI) +
# as-filed EPS coherence + label contiguity all green.
actuals:
