# ---------------------------------------------------------------------------
# Historical one-step backtest methodology — FISCAL slots [FQ1..FQ4].
# Mechanical (SNDK precedent): medians of the realised post-break record,
# NOT the forward view.
# 🔴 IN-SAMPLE — NOT SKILL EVIDENCE: the slot growth, op_margin, ETR and
# below-OP ratio below are fitted on the SAME 10 actuals the backtest scores.
# The backtest is therefore a consistency check, not a performance claim
# (START §154). Within this sample revenue MASE 0.652 / Theil U2 0.749 were
# below the random walk, which is NOT out-of-sample skill; EPS MASE 1.264 /
# U2 1.455 exceed 1 even in-sample. See notes BACKTEST_IN_SAMPLE.
#   revenue_growth_qoq: per-slot median QoQ over the 10 one-step transitions
#     (FQ1 n=2, FQ2 n=3, FQ3 n=3, FQ4 n=2; FQ4 transitions are 13w->13w).
#   op_margin 0.2414: median GAAP operating margin of the 10 target quarters.
#   effective_tax_rate 0.1341: median GAAP ETR of the profitable target quarters.
#   net_interest_pct_of_revenue -0.00228: median (pretax − operating income)/revenue.
# ⚠️ EXPECTED TO PERFORM BADLY: GAAP op margin moved −23.9% -> +80.4% inside the
# window; one median cannot track it. Report MASE/Theil honestly even if > 1.
# ---------------------------------------------------------------------------
backtest_methodology:
  revenue_growth_qoq: [0.1647, 0.2323, 0.1695, 0.1772]
  op_margin: 0.2414
  effective_tax_rate: 0.1341
  net_interest_pct_of_revenue: -0.00228

