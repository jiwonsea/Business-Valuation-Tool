# 2026-06 재구성: IPO 옵션 제거(2026.07 상장기한 미준수로 사실상 철회) +
# CPS 자력 상환 확정 추진(자기주식 취득 임시주총, SK㈜의 FI 지분 일부 ~2,000억 인수).
# 시나리오 축이 'IPO 성공/실패'에서 '상환 후 잔존 일반주주 지분가치'로 이동.
# 전 시나리오 CPS 상환->소각으로 보통주(54,278,993주)만 잔존. growth_adj_pct로 EV 차등(Bull>Base>Bear).
scenarios:
  Base:
    name: "자력 상환 (확정 경로)"
    prob: 65
    ipo: "불발"
    irr: 5.0
    dlom: 15            # 자력·질서있는 상환 + SK㈜ 백스톱 -> 강제매각 할인 완화(기존 20->15)
    cps_repay: null     # IRR 5% 복리 자동 산출 (600,000×1.05^4≈729,300)
    rcps_repay: 490000  # 배당 기지급 차감 후 협상 추정치
    buyback: 200000     # 자기주식 취득 프로그램(임시주총 승인)
    shares: 54278993    # CPS 상환·소각 -> 보통주만
    growth_adj_pct: 0
    desc: "IPO 철회, 자체 현금으로 CPS 질서있게 상환. FI와 IRR 5% 우호적 정산"
  Bull:
    name: "상환 + 하이테크 마진 정착"
    prob: 20
    ipo: "불발"
    irr: 5.0
    dlom: 12
    cps_repay: null
    rcps_repay: 490000
    buyback: 200000
    shares: 54278993
    growth_adj_pct: 15  # 용인 반도체·AI DC 하이테크 마진 인플렉션 일부 정착 -> 세그먼트 EBITDA +15%
    desc: "상환 확정 + Q1 실적 모멘텀(매출 +99%, OP 마진 개선) 구조적 지속"
  Bear:
    name: "상환 지연·분쟁 잔존"
    prob: 15
    ipo: "불발"
    irr: 12.0
    dlom: 25
    cps_repay: null     # IRR 12% -> 600,000×1.12^4≈944,100
    rcps_repay: 575000
    buyback: 200000
    shares: 54278993
    growth_adj_pct: -10 # 마진 정상화·운전자본 부담 -> 세그먼트 EBITDA −10%
    desc: "상환 일정 지연/FI 잔여 분쟁, IRR 12% 강제 + 마진 되돌림"

dcf_params:
  ebitda_growth_rates: [0.10, 0.08, 0.06, 0.05, 0.04]
  tax_rate: 22.0
  capex_to_da: 1.10
  nwc_to_rev_delta: 0.05
  terminal_growth: 2.5
  terminal_ev_ebitda: 7.0      # Exit Multiple TV cross-check (건설/환경 복합 6~8x)
  actual_capex: 350000      # 2025 actual Capex (KRW M) — from cash flow statement
  actual_nwc: 610000        # 2025 net working capital (KRW M) — current assets minus current liabilities
  prior_nwc: 580000         # 2024 net working capital (KRW M)

cps_principal: 600000       # CPS 6,000억원 (2022.07 발행, zero-coupon)
cps_years: 4                # 만기 2026.07
cps_dividend_rate: 0.0      # IPO 전까지 무배당; 불발 시 5%->8%->11% step-up (+3%p/yr)

rcps_principal: 400000      # RCPS 4,000억원 (2022.06 발행)
rcps_years: 5               # 만기 2027.06 (CPS와 다름!)
rcps_dividend_rate: 7.5     # 연동형 배당 7.4~7.6% (5.5% or 회사채+1.45%p 중 높은 값)

net_debt: 2295568          # 정상화 순차입금(steady-state). Q1'26 spot 3,230,880, 증가분 +935,312 전액이 1.23조 운전자본 일시 유출(매출 +99% 램프업)에서 기인 — 영업CF(WC前) +995,643이 투자·재무 유출 전액 커버. FY2025 EBITDA(정상화)와 정합. spot 적용 다운사이드는 본문 민감도로 별도 제시
eco_frontier: 94644
base_year: 2025            # 세그먼트 경제성은 FY2025 정상화 기준 (Q1 세그먼트 주석 미공개 + 마진 급등 일회성 혼재)

# Cross-validation multiples (0 = skip that method)
ev_revenue_multiple: 0.5    # EV/Revenue: construction/environmental conglomerate 0.4~0.6x
pe_multiple: 15.0           # P/E: peer average 13~17x
pbv_multiple: 1.2           # P/BV: 1.0~1.5x after unlisted discount

# Monte Carlo simulation
mc_enabled: true
mc_sims: 10000
mc_multiple_std_pct: 15.0   # Multiple std dev (applied value +/-15%)
mc_dlom_mean: 17.0          # DLOM mean (Base 15 ~ Bear 25 중심, 기존 20에서 하향)
mc_dlom_std: 5.0            # DLOM std dev

