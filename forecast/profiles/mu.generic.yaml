# fixed or explicitly refused BEFORE it is used for (d)/SF8/skill.
#
# Label digit = fiscal quarter, so generic_cli _slot() selects the FISCAL slot:
# backtest_methodology.revenue_growth_qoq is ordered [FQ1, FQ2, FQ3, FQ4];
# forward bear/base/bull vectors are POSITIONAL from the seed:
# [FY26Q4, FY27Q1, FY27Q2, FY27Q3].
# ---------------------------------------------------------------------------
