#   연결 Q1'26: 매출 4,899,713 / OP 931,444 / 순익 519,195 (백만원), 부채비율 176.2%.
#   세그먼트 단위 EBITDA는 분기 주석 미공개(JS 렌더) → 세그먼트 경제성은 FY2025 정상화 기준 유지(base_year=2025).
