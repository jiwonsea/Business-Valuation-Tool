- name: 삼성전자 (Samsung Electronics) - Semiconductor Division
  segment_code: SEG1
  ev_ebitda: 9.7
  notes: 'Korean peer: Memory & foundry services for AI chips. Broader diversification
    but growing AI infrastructure exposure. Estimated semiconductor division multiple.'
- name: AMD Gaming (Radeon Division)
  segment_code: SEG2
  ev_ebitda: 14.2
  notes: Direct competitor in consumer GPU market. Similar gaming hardware focus.
    AMD consolidated multiple ~18x, gaming division estimated at 14-15x due to lower
    margins.
- name: Qualcomm Inc. (Gaming SoC)
  segment_code: SEG2
  ev_ebitda: 13.8
  notes: Mobile gaming processors (Snapdragon). Different form factor but comparable
    consumer gaming focus. Qualcomm consolidated ~13-14x, gaming component estimated
    similarly.
- name: Sony Group Corporation (PlayStation Hardware)
  segment_code: SEG2
  ev_ebitda: 9.5
  notes: Gaming platform hardware manufacturer. Lower multiple reflects hardware commodity
    nature and lower margins vs. GPU design. 2024 Sony consolidated multiple ~9-10x.
- name: Corsair Gaming Inc.
  segment_code: SEG2
  ev_ebitda: 8.1
  notes: Gaming hardware peripherals & components. Broader consumer electronics exposure.
    Lower multiple reflects hardware commodity risk and lower margins.
- name: Qualcomm Inc. (Automotive SoC)
  segment_code: SEG3
  ev_ebitda: 13.8
  notes: Automotive semiconductor leader (Snapdragon Ride). Similar embedded/automotive
    focus. Qualcomm consolidated ~13-14x, automotive component estimated at similar
    range.
- name: NXP Semiconductors
  segment_code: SEG3
  ev_ebitda: 15.2
  notes: Leading automotive semiconductor supplier. Direct competitor in automotive
    embedded systems. 2024 consensus EV/EBITDA ~15-16x reflects automotive growth
    and margin profile.
- name: Synopsys Inc.
  segment_code: SEG3
  ev_ebitda: 28.5
  notes: Design tools & IP for semiconductor design. Complementary to NVIDIA's visualization/design
    tools. Premium multiple reflects software/IP nature and recurring revenue.
- name: Cadence Design Systems
  segment_code: SEG3
  ev_ebitda: 26.8
  notes: EDA software for chip design. Similar professional visualization/design tool
    focus. Premium multiple reflects software business model and high margins.

