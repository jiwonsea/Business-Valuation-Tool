# ============================== SCENARIO DESIGN ===============================
# The forward path is NOT an extrapolation of history (there is none). It is a
# CONTRACT-DRIVEN build: two disclosed compute contracts with known start dates
# dominate 2026 revenue, and Starlink is modelled bottom-up from subscribers x
# ARPU cross-checked against the 2026Q1 segment actual.
#
#   Anthropic  $1.25bn/month, Colossus I+II, through May 2029 (~$45bn), 90-day
#              termination notice. Ramp: "May-June 2026 at a discounted rate",
#              full rate afterwards.  -> 2026Q2 gets 2 discounted months.
#   Google     ~$920M/month for ~110k GPUs (~$30bn term). Contract STARTS
#              OCTOBER; ramp "through September at a reduced fee"; SpaceX must
#              deliver the committed GPUs by 2026-09-30 or Google may terminate.
#              -> essentially ZERO Google revenue in 2026Q2; Q4 is the step.
#
# COMMON-DELTA R1 applied in its stated form ("no historical average; level =
# latest actual or company guidance"): every segment level is anchored to the
# 2026Q1 ACTUAL and moved only by contract mechanics, never by a fitted trend.
# R1's July direction (mark margins DOWN) is explicitly NOT carried over — see
# COMMON-DELTA §1 R1 reversal warning.
#
# COMMON-DELTA R2 applied: the below-OP block is NOT anchored to the 2026Q1
# outturn. 2026Q1 carried $1,870M of "net other expenses" (merger / fair-value
# items) on top of interest; base sets that component to ZERO and carries it in
# the band. Only the INTEREST floor is anchored, because it is computable from
# debt x rate (SF3 exception). net_interest_pct_of_revenue below is therefore
# interest-only: negative in 2026Q2 (debt $29.1bn + $20bn bridge, FY25 interest
# $1.9bn, 2026Q1 interest +48.5% YoY), turning POSITIVE from 2026Q3 as ~$75bn of
# IPO proceeds earn interest and the bridge is repaid.
#
# COMMON-DELTA R3 applied: effective tax rate is a RANGE across scenarios, not a
# single anchor. A loss-making issuer with a full valuation allowance books ~0%;
# rates only matter in the quarters where the model turns profitable.

